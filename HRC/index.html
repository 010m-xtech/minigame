<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ハッピーリングチャリティ プロモーション</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', sans-serif;
      /* スクロールによる画面の揺れを防ぐ */
      overscroll-behavior: none; 
    }

    /* 問題移動時（右へ歩いて画面外へ出た後、左から戻る）アニメーション */
    /* ※ leftプロパティを動かすことで、画面サイズに関わらず確実に横移動させます */
    @keyframes walk-to-next {
      0% { left: 50%; opacity: 1; }
      40% { left: 150%; opacity: 1; } /* 画面右外へはける */
      45% { left: 150%; opacity: 0; } /* 画面外で透明に */
      50% { left: -50%; opacity: 0; } /* 左の画面外へワープ */
      55% { left: -50%; opacity: 1; } /* 左の画面外で実体化 */
      100% { left: 50%; opacity: 1; } /* 左から中央へ到着 */
    }
    .char-walk-next {
      animation: walk-to-next 8s ease-in-out forwards;
    }

    /* 退場時（右へ歩き去る）アニメーション */
    @keyframes walk-out {
      0% { left: 50%; opacity: 1; }
      100% { left: 150%; opacity: 0; }
    }
    .char-walk-out {
      animation: walk-out 4s linear forwards;
    }

    /* 足が動いている（歩いている）ように見せるトコトコアニメーション */
    @keyframes wobble {
      0%, 100% { transform: translateX(-50%) rotate(0deg) translateY(0); }
      25% { transform: translateX(-50%) rotate(15deg) translateY(-5px); }
      50% { transform: translateX(-50%) rotate(0deg) translateY(0); }
      75% { transform: translateX(-50%) rotate(-15deg) translateY(-5px); }
    }
    .wobbling {
      animation: wobble 0.5s infinite !important;
    }

    /* 背景スライドの滑らかなトランジション */
    .bg-slide-transition {
      transition: transform 3s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-800 flex justify-center items-center min-h-[100dvh] w-full m-0 p-0 overflow-hidden">
  
  <!-- スマートフォンサイズに制限するコンテナ (PCでは中央にスマホサイズで表示) -->
  <div class="bg-gray-900 text-gray-800 w-full h-[100dvh] max-w-md md:h-[85dvh] md:max-h-[900px] md:rounded-[2rem] md:shadow-2xl overflow-hidden flex flex-col relative ring-1 ring-white/10 md:ring-4 md:ring-black/20">

  <!-- 全画面背景レイヤー (スライド＆クロスフェード用) -->
  <div class="absolute inset-0 z-0 pointer-events-none bg-gray-900 overflow-hidden">
    <!-- 画像が横移動しながらフェードするためのレイヤー群。幅を120%にして端が見えないようにする -->
    <div id="bg-0" class="absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out translate-x-0 opacity-100" style="background-image: url('quiz1.jpg');"></div>
    <div id="bg-1" class="absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out translate-x-[10%] opacity-0" style="background-image: url('quiz2.jpg');"></div>
    <div id="bg-2" class="absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out translate-x-[10%] opacity-0" style="background-image: url('quiz3.jpg');"></div>
    <div id="bg-3" class="absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out translate-x-[10%] opacity-0" style="background-image: url('quiz4.jpg');"></div>
    <div id="bg-4" class="absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out translate-x-[10%] opacity-0" style="background-image: url('quiz5.jpg');"></div>
    
    <!-- UIや文字が見やすいように全体を少し暗くするオーバーレイ -->
    <div class="absolute inset-0 bg-black/30"></div>
  </div>

  <!-- 画面上部〜中央 (クイズエリア) -->
  <main class="flex-1 flex flex-col relative z-10 px-4 pt-6 pb-2">
    
    <!-- クイズ進行状況と問題文 -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-5 shadow-lg border-2 border-orange-100 mb-6 text-center z-20">
      <h2 id="quiz-number" class="text-orange-600 font-bold text-lg mb-2">第1問</h2>
      <p id="quiz-text" class="text-xl font-bold leading-relaxed min-h-[4.5rem] flex items-center justify-center">
        生ビール1L提供につき1円が寄付されるキャンペーンがある
      </p>
    </div>

    <!-- 〇✖ボタン -->
    <div id="quiz-buttons" class="flex justify-center space-x-8 mb-4 z-20">
      <button onclick="handleAnswer(true)" class="w-24 h-24 rounded-full bg-transparent text-red-500 text-6xl font-black border-[6px] border-red-500 active:bg-red-500/20 active:scale-95 transition-all flex items-center justify-center">〇</button>
      <button onclick="handleAnswer(false)" class="w-24 h-24 rounded-full bg-transparent text-blue-500 text-6xl font-black border-[6px] border-blue-500 active:bg-blue-500/20 active:scale-95 transition-all flex items-center justify-center">✖</button>
    </div>
  </main>

  <!-- 画面下部 (歩行キャラクター配置用エリア) -->
  <div class="h-40 relative shrink-0 z-20 pointer-events-none overflow-hidden">
    <!-- 歩行キャラクター (maru.png) -->
    <!-- -translate-x-1/2 と left-1/2 で中央に配置 -->
    <img id="character" src="maru.png" alt="キャラクター" class="absolute bottom-8 left-1/2 -translate-x-1/2 w-24 h-auto drop-shadow-md">
  </div>

  <!-- 解説モーダル (回答直後に表示) -->
  <div id="explanation-modal" class="absolute inset-0 bg-black/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden">
      <!-- 装飾用背景図形 -->
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-100 rounded-full opacity-50"></div>
      
      <div id="modal-result-icon" class="text-5xl text-center mb-2 relative z-10"></div>
      <h3 id="modal-result-title" class="text-2xl font-bold text-center mb-4 relative z-10"></h3>
      
      <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 mb-6 relative z-10">
        <p id="modal-explanation" class="text-gray-700 text-sm font-semibold leading-loose"></p>
      </div>
      
      <button id="next-btn" onclick="goToNext()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-4 rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all relative z-10 text-lg">
        次の居酒屋へ進む
      </button>
    </div>
  </div>

  <!-- クライマックス用ホワイトアウト -->
  <div id="whiteout" class="absolute inset-0 bg-white z-[60] hidden opacity-0 transition-opacity duration-[2000ms]"></div>

  <!-- 最終結果画面 -->
  <div id="result-screen" class="absolute inset-0 bg-orange-50 z-[70] hidden opacity-0 transition-opacity duration-1000 flex-col items-center justify-start overflow-y-auto pb-10">
    <!-- ヘッダー画像風の装飾 -->
    <div class="w-full bg-gradient-to-b from-orange-300 to-orange-50 py-10 flex flex-col items-center justify-center rounded-b-[3rem] shadow-sm mb-8">
      <div class="text-6xl mb-4 animate-bounce">🍽️👦👧😊</div>
      <h1 class="text-2xl font-bold text-orange-800">子どもたちの笑顔の食卓</h1>
    </div>
    
    <!-- 認定証 -->
    <div class="bg-white border-4 border-yellow-400 p-6 rounded-2xl shadow-xl w-11/12 max-w-sm relative mt-4">
      <div class="absolute -top-6 -left-4 text-5xl transform -rotate-12">👑</div>
      <div class="absolute -top-6 -right-4 text-5xl transform rotate-12">🍻</div>
      
      <div class="text-center border-b-2 border-dashed border-gray-300 pb-4 mb-4">
        <h2 class="text-xl font-bold text-gray-800 tracking-wider">本日の乾杯サポーター</h2>
        <h3 class="text-2xl font-black text-yellow-600 mt-1">認定証</h3>
      </div>
      
      <p class="text-sm text-gray-700 leading-relaxed font-semibold">
        あなたは、美味しいお酒を楽しみながら、地域の子ども食堂や子どもたちの未来を応援する「ハッピーリングチャリティ」の趣旨を深く理解されました。<br><br>
        すべてのクイズをクリアしたことを称え、ここに「乾杯サポーター」として認定いたします。
      </p>
      
      <div class="mt-6 text-right">
        <p class="text-xs text-gray-500 mb-1">心を込めて</p>
        <p class="font-bold text-lg text-orange-900 signature-font">マルト水谷</p>
      </div>
    </div>
    
    <button onclick="location.reload()" class="mt-10 px-8 py-4 bg-gray-800 text-white rounded-full font-bold shadow-lg active:scale-95 transition-transform flex items-center space-x-2">
      <span>🔄 最初からやり直す</span>
    </button>
  </div>

  <script>
    // --- クイズデータの定義 ---
    const quizData = [
      {
        question: "生ビール1L提供につき1円が寄付されるキャンペーンがある",
        answer: true,
        explanation: "ハッピーリングチャリティは、お店でいつも通りビールを飲むだけでできる社会貢献です。"
      },
      {
        question: "集まった寄付金は『子ども食堂』などに寄付される",
        answer: true,
        explanation: "地域の未来を担う子どもたちの悩みや不安を解消し、ひとりでも多くの子どもに笑顔を届けるために活用されます。"
      },
      {
        question: "キャンペーンに参加すると、お店側に追加料金の負担が発生する？",
        answer: false,
        explanation: "追加料金は一切不要です！寄付金はマルト水谷が全額負担します。販促グッズ等も無料で提供されます。"
      },
      {
        question: "子ども食堂は、食事をするため「だけ」の場所である？",
        answer: false,
        explanation: "食事だけでなく、学習支援や地域の人々との交流の場としても機能しており、子どもたちの安心できる居場所となっています。"
      },
      {
        question: "この取り組みは、SDGsへの貢献につながる",
        answer: true,
        explanation: "「貧困をなくそう」「すべての人に健康と福祉を」など、SDGsの目標達成に向けた活動の一環として推進されています。"
      }
    ];

    // --- 状態変数 ---
    let currentIndex = 0;
    
    // --- DOM要素の取得 ---
    const qNumberEl = document.getElementById('quiz-number');
    const qTextEl = document.getElementById('quiz-text');
    const character = document.getElementById('character');
    const quizButtons = document.getElementById('quiz-buttons');
    
    const modal = document.getElementById('explanation-modal');
    const modalContent = document.getElementById('modal-content');
    const modalIcon = document.getElementById('modal-result-icon');
    const modalTitle = document.getElementById('modal-result-title');
    const modalExplanation = document.getElementById('modal-explanation');
    const nextBtn = document.getElementById('next-btn');
    
    const whiteout = document.getElementById('whiteout');
    const resultScreen = document.getElementById('result-screen');

    // --- 初期表示 ---
    function initQuiz() {
      updateQuizUI();
    }

    function updateQuizUI() {
      const currentQ = quizData[currentIndex];
      qNumberEl.textContent = `第${currentIndex + 1}問`;
      qTextEl.textContent = currentQ.question;
      // ボタンを有効化
      quizButtons.style.pointerEvents = 'auto';
      quizButtons.style.opacity = '1';
    }

    // --- 回答処理 ---
    function handleAnswer(selectedAnswer) {
      // ボタンの連打防止
      quizButtons.style.pointerEvents = 'none';
      quizButtons.style.opacity = '0.5';

      const currentQ = quizData[currentIndex];
      const isCorrect = (selectedAnswer === currentQ.answer);

      // モーダル内容の設定
      if (isCorrect) {
        modalIcon.textContent = "🎉";
        modalTitle.textContent = "大正解！";
        modalTitle.className = "text-2xl font-bold text-center mb-4 relative z-10 text-red-500";
      } else {
        modalIcon.textContent = "💡";
        modalTitle.textContent = "惜しい！";
        modalTitle.className = "text-2xl font-bold text-center mb-4 relative z-10 text-blue-500";
      }
      modalExplanation.textContent = currentQ.explanation;

      // 最終問題の場合はボタンのテキストを変更
      if (currentIndex === quizData.length - 1) {
        nextBtn.textContent = "結果を見る";
        nextBtn.className = "w-full bg-gradient-to-r from-pink-500 to-red-500 text-white font-bold py-4 rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all relative z-10 text-lg";
      }

      // 少し遅延させてモーダルを表示
      setTimeout(showModal, 600);
    }

    // --- モーダル制御 ---
    function showModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
      }, 10);
    }

    function hideModal(callback) {
      modal.classList.add('opacity-0');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        if (callback) callback();
      }, 300);
    }

    // --- 次の居酒屋へ（またはクライマックスへ） ---
    function goToNext() {
      hideModal(() => {
        if (currentIndex < quizData.length - 1) {
          // 次の問題へ
          currentIndex++;
          
          // 背景を横にスライドさせながらクロスフェードで切り替える
          for (let i = 0; i < quizData.length; i++) {
            const layer = document.getElementById(`bg-${i}`);
            if (!layer) continue;
            
            // ベースとなるスタイルクラス
            const baseClasses = "absolute w-[120%] -left-[10%] h-full top-0 bg-cover bg-bottom bg-no-repeat transition-all duration-[8000ms] ease-in-out";
            
            if (i < currentIndex) {
              // 過去のステージ：左へ流れながら消える
              layer.className = `${baseClasses} -translate-x-[10%] opacity-0`;
            } else if (i === currentIndex) {
              // 現在のステージ：右から中央へ現れながら表示される
              layer.className = `${baseClasses} translate-x-0 opacity-100`;
            } else {
              // 未来のステージ：右に待機
              layer.className = `${baseClasses} translate-x-[10%] opacity-0`;
            }
          }
          
          // キャラクターのアニメーションを開始
          character.classList.add('char-walk-next');
          character.classList.add('wobbling'); // トコトコ歩くアニメーションを追加
          
          // アニメーション完了（8秒後）に次の問題をセットし、クラスを外す
          setTimeout(() => {
            character.classList.remove('char-walk-next');
            character.classList.remove('wobbling');
            updateQuizUI();
          }, 8000);

        } else {
          // 全5問終了 -> クライマックス演出
          playClimax();
        }
      });
    }

    // --- クライマックス演出 ---
    function playClimax() {
      // 1. キャラクターが右へ歩いて退場
      character.classList.add('char-walk-out');
      character.classList.add('wobbling'); // 足を動かす

      // 2. ホワイトアウト画面を表示（歩く速度に合わせて表示を遅らせる）
      setTimeout(() => {
        whiteout.classList.remove('hidden');
        setTimeout(() => {
          whiteout.classList.remove('opacity-0');
        }, 10);
      }, 3000);

      // 3. 結果画面へ切り替え
      setTimeout(() => {
        resultScreen.classList.remove('hidden');
        resultScreen.classList.add('flex');
        
        whiteout.style.transitionDuration = '1000ms';
        whiteout.classList.add('opacity-0');
        
        setTimeout(() => {
          resultScreen.classList.remove('opacity-0');
          setTimeout(() => {
            whiteout.classList.add('hidden');
          }, 1000);
        }, 100);
        
      }, 5000);
    }

    // --- アプリケーション開始 ---
    window.onload = () => {
      initQuiz();
    };
  </script>
</body>
</html>
