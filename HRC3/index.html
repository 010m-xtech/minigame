<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハッピーリングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* -------------------------------------
           全体設定
        ------------------------------------- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* -------------------------------------
           背景設定
        ------------------------------------- */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            /* 背景の切り替わり速度を2.5秒に変更（キャラクター到着と完全に一致させる） */
            transition: opacity 2.5s ease-in-out;
            z-index: 1;
        }

        .background-layer.active {
            opacity: 1;
        }

        /* 最後の画面への遷移用スローモーション */
        .background-layer.slow-transition {
            transition: opacity 3s ease-in-out !important;
        }

        /* スタートから1問目への遷移用スローモーション */
        .background-layer.very-slow-transition {
            transition: opacity 6s ease-in-out !important;
        }

        /* -------------------------------------
           白オーバーレイの追加
        ------------------------------------- */
        .white-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4); /* 初期状態（スタート画面）は40%に変更 */
            z-index: 2;
            pointer-events: none;
            transition: background-color 1.5s; /* クイズ画面への遷移に合わせてフェードアウト */
        }

        .white-overlay.hidden {
            background-color: rgba(255, 255, 255, 0); /* 非表示状態 */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: 3;
            pointer-events: none;
            transition: background 1s ease;
        }

        /* 4問目用の中心をくり抜いたオーバーレイ */
        .overlay.hole {
            /* 中心にうっすら黒(20%)を乗せて色を濃く見せ、外側は白(30%)にする */
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.15) 25%, rgba(255,255,255,0.3) 45%, rgba(255,255,255,0.3) 100%);
        }

        /* -------------------------------------
           スタート画面・クリア画面
        ------------------------------------- */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 全体を中央寄せベースに */
            align-items: center;
            pointer-events: none;
        }

        /* -------------------------------------
           タイトルデザイン
        ------------------------------------- */
        .title-container {
            text-align: center;
            z-index: 200;
            pointer-events: none;
            position: absolute; 
            top: 8%; /* 画面上部から8%の位置 */
            width: 90%;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 1s, transform 1s;
        }

        .title-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* タイトル画像のアニメーション（右の壁→天井→着地） */
        @keyframes popIn {
            0% {
                opacity: 0;
                /* 画面のずっと左外側からスタート */
                transform: translateX(-150vw) translateY(20px) rotate(-45deg);
            }
            15% {
                opacity: 1;
                /* 左から右へ画面を横切る様子が見えるように */
                transform: translateX(-50vw) translateY(0px) rotate(-20deg);
            }
            35% {
                /* 右側の壁に激突（横から潰されて縦に伸びる） */
                transform: translateX(20vw) translateY(-30px) scale(0.7, 1.2) rotate(15deg);
            }
            60% {
                /* 上（天井）に跳ね返って激突（縦に潰されて横に伸びる） */
                transform: translateX(-5vw) translateY(-130px) scale(1.3, 0.7) rotate(-10deg);
            }
            75% {
                /* 下に落下して地面に着地（上から潰される） */
                transform: translateX(2vw) translateY(40px) scale(1.3, 0.7) rotate(5deg);
            }
            85% {
                /* 少し上に跳ねる */
                transform: translateX(0vw) translateY(-15px) scale(0.9, 1.1) rotate(-2deg);
            }
            95% {
                /* 軽く着地 */
                transform: translateX(0vw) translateY(5px) scale(1.05, 0.95) rotate(1deg);
            }
            100% {
                opacity: 1;
                /* 定位置で停止 */
                transform: translateX(0) translateY(0) scale(1) rotate(0deg);
            }
        }

        /* ロゴのふわふわアニメーション */
        @keyframes floatLogo {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            50% { transform: scale(1) translateY(-10px) rotate(0deg); }
        }

        .title-word {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
        }

        .title-container.show .title-word-1 {
            /* 飛び出すアニメーション(popIn)が完了した直後に、ふわふわアニメーション(floatLogo)に切り替えてループ */
            animation-name: popIn, floatLogo;
            animation-duration: 1.5s, 3s;
            animation-timing-function: ease-out, ease-in-out;
            animation-delay: 0s, 1.5s;
            animation-fill-mode: forwards, forwards;
            animation-iteration-count: 1, infinite;
        }

        /* スタートボタンのふわふわアニメーション */
        @keyframes floatBtn {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(calc(-50% - 8px)); }
        }

        /* スタートボタンをぽわっと光らせる（発光）アニメーション */
        @keyframes pulseGlow {
            0%, 100% { 
                box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
                filter: brightness(1);
            }
            50% { 
                box-shadow: 0 0 25px rgba(255, 154, 158, 1);
                filter: brightness(1.15); /* ボタン全体（文字も）が少し明るくなる */
            }
        }

        .start-btn {
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.8s ease;
            font-size: 1.5rem;
            padding: 15px 50px;
            position: absolute; 
            top: 62%; 
            transform: translateY(-50%); 
            will-change: transform;
        }
        
        .start-btn.show {
            opacity: 1;
            /* 透明からフェードインし終わる頃にふわふわ＆発光を開始 */
            animation: 
                floatBtn 2.5s ease-in-out 0.8s infinite,
                pulseGlow 1.5s ease-in-out 0.8s infinite;
        }

        /* ふわふわ中のスタートボタンを押した時のへこみアニメーション調整 */
        .start-btn:active {
            transform: translateY(-50%) scale(0.95) !important;
            animation-play-state: paused;
        }

        #completion-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            /* 背景の変化に合わせて、文章もゆっくり2.5秒かけて表示させる */
            transition: opacity 2.5s ease-in-out;
            padding: 10px;
        }

        #completion-screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* -------------------------------------
           クイズUI・モーダル
        ------------------------------------- */
        #quiz-ui-container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 20px 20px;
            max-height: 60vh; 
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #quiz-ui-container.active {
            opacity: 1;
            visibility: visible;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .choice-btn {
            flex: 1;
            backdrop-filter: blur(5px);
            border: 3px solid;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s, border-color 0.2s;
            cursor: pointer;
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .next-btn {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
            color: #d13b53;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* -------------------------------------
           キャラクター設定
        ------------------------------------- */
        #character-container {
            position: absolute;
            bottom: 2%; 
            left: 50%;
            z-index: 5;
            display: grid;
            place-items: end center;
            pointer-events: none;
            will-change: transform;
            transform: translateX(-50%) translateX(-400px); 
        }

        /* 2つの画像に共通の設定 */
        #character-img-static, 
        #character-img-walk {
            grid-area: 1 / 1; 
            height: 180px; 
            width: auto;
            object-fit: contain;
            transform-origin: bottom center;
        }

        /* 止まっている時の画像 */
        #character-img-static {
            transform: scale(1.02); 
            display: block; 
        }

        /* 歩いている時の画像 */
        #character-img-walk {
            transform: scale(1.22) translateY(30px);  
            display: none; 
        }
    </style>
</head>
<!-- iOS Safariでボタンのへこみ(:active)を機能させるための魔法の1行 ontouchstart="" -->
<body ontouchstart="">

<div id="app-container">
    <div id="start-screen">
        <div id="start-title-container" class="title-container" style="display: none;">
            <!-- ロゴ画像 -->
            <div class="text-center w-full">

    <div id="result-modal" class="modal">

    <!-- クリア画面 -->
    <div id="completion-screen">

        <div class="glass-panel text-center w-full max-w-md px-3 sm:px-6" style="background: rgba(255, 255, 255, 0.8); backdrop-filter: none; border: 1px solid rgba(255,255,255,0.9);">

            <!-- 文字サイズをスマホ幅に合わせて調整し、特定の文章が折り返さないように設定 -->
            <div class="inline-block text-left">
                <p class="text-gray-900 text-[19px] sm:text-2xl mb-4 font-bold leading-relaxed" style="text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff, 0px 2px 4px rgba(255,255,255,1);">
                    <span class="whitespace-nowrap">ご参加ありがとうございます！</span><br><br>
                    この後もいつも通り美味しく<br>
                    生ビールを飲んで楽しんでください！<br><br>
                    あなたの「美味しい！」が、<br>
                    子どもたちの笑顔につながります。<br><br>
                    <span class="whitespace-nowrap">さぁ、今日も楽しくカンパイしましょう！</span>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            qNum: 1,
            question: "参加店舗で「生ビール」が1リットル提供されるごとに、1円が<span class=\"whitespace-nowrap\">寄付</span>される。",
            answer: "〇",
            explanation: "正解は〇！キャンペーン期間中、参加店で<span class=\"text-red-600\">生ビール</span>が<span class=\"text-red-600\">1リットル注文されるごと</span>に、<span class=\"text-red-600\">1円が寄付金</span>になります。"
        },
        {
            qNum: 2,
            question: "集まった寄付金は、子ども食堂や子どもの問題解決に取り組む団体に寄付される。",
            answer: "〇",
            explanation: "正解は〇！「カンパイでつなぐ 子どもたちの笑顔の輪」を目指して、<span class=\"text-red-600\">子ども食堂などの支援</span>に役立てられます。"
        },
        {
            qNum: 3,
            question: "お客様がこのチャリティに参加するには、生ビール1杯につき追加で1円のお金を払う必要がある。",
            answer: "✕",
            explanation: "正解は✕！寄付金の1円は<span class=\"text-red-600\">マルト水谷より寄付</span>されるため、<span class=\"text-red-600\">お客様が追加でお金を払う必要はありません。</span><br>お店でいつも通り美味しく楽しく<span class=\"text-red-600\">生ビールを飲むだけ</span>で社会貢献につながる仕組みです！"
        },
        {
            qNum: 4,
            question: "子ども食堂は、食事を提供するだけで「勉強」や「交流」をする<span class=\"whitespace-nowrap\">場所</span>ではない。",
            answer: "✕",
            explanation: "正解は✕！子ども食堂は食事だけでなく、<span class=\"text-red-600\">学習支援</span>や<span class=\"text-red-600\">絵本の読み聞かせ</span>、<span class=\"text-red-600\">地域の人との交流や体験の場</span>としても活動しています。"
        },
        {
            qNum: 5,
            question: "このチャリティ活動は、国連が定める「SDGs（持続可能な開発目標）」の取り組みにもつながっている。",
            answer: "〇",
            explanation: "正解は〇！「<span class=\"text-red-600 font-bold\">貧困をなくそう</span>」「<span class=\"text-red-600 font-bold\">飢餓をゼロに</span>」など、SDGsの目標達成にもつながる取り組みです。"
        }
    ];

    let currentQuestionIndex = 0;

    // --- スワイプ操作用変数 ---
    let isDraggable = false;
    let isDragging = false;
    let currentXOffset = 0;
    let startClientX = 0;
    let initialXOffset = 0;
    let direction = 1; // 1: 右向き, -1: 左向き

    // --- ジャンプ操作用変数 ---
    let startClientY = 0;
    let currentYOffset = 0;
    let isJumping = false;
    let jumpStartTime = 0;
    const JUMP_DURATION = 500; // ジャンプにかかる時間(ミリ秒)
    const JUMP_HEIGHT = 120;   // ジャンプの高さ(ピクセル)

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const characterContainer = document.getElementById('character-container');
    const resultModal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const completionScreen = document.getElementById('completion-screen');
    const quizUiContainer = document.getElementById('quiz-ui-container');

    // ==========================================
    // アニメーション切り替え
    // ==========================================
    function setWalking(isWalk) {
        document.getElementById('character-img-static').style.display = isWalk ? 'none' : 'block';
        document.getElementById('character-img-walk').style.display = isWalk ? 'block' : 'none';
    }

    // --- キャラクターの向きを更新 ---
    function updateCharacterDirection() {
        const staticImg = document.getElementById('character-img-static');
        const walkImg = document.getElementById('character-img-walk');
        if (!staticImg || !walkImg) return;
        staticImg.style.transform = direction === 1 ? 'scale(1.02)' : 'scale(-1.02, 1.02)';
        walkImg.style.transform = direction === 1 ? 'scale(1.22) translateY(30px)' : 'scale(-1.22, 1.22) translateY(30px)';
    }

    // --- XとYの位置をキャラクターに適用する関数 ---
    function updateCharacterTransform() {
        characterContainer.style.transform = `translateX(-50%) translateX(${currentXOffset}px) translateY(${currentYOffset}px)`;
    }

    // --- ジャンプアニメーション処理 ---
    function jump() {
        if (isJumping) return;
        isJumping = true;
        
        requestAnimationFrame((timestamp) => {
            jumpStartTime = timestamp;
            jumpStep(timestamp);
        });
    }

    function jumpStep(timestamp) {
        if (!isJumping) return; // 次の画面に進んだ時などの強制終了用
        
        const elapsed = timestamp - jumpStartTime;
        if (elapsed < JUMP_DURATION) {
            // 放物線の計算（空中に上がって落ちてくる動き）
            const t = elapsed / JUMP_DURATION;
            currentYOffset = -4 * JUMP_HEIGHT * t * (1 - t);
            updateCharacterTransform();
            requestAnimationFrame(jumpStep);
        } else {
            // 着地
            currentYOffset = 0;
            isJumping = false;
            updateCharacterTransform();
        }
    }

    // --- スワイプイベントハンドラ ---
    // タッチかマウスかを判定して座標を取得する共通関数
    function getClientPos(e) {
        return e.type.includes('touch') ? e.touches[0] : e;
    }

    function handleDragStart(e) {
        if (!isDraggable) return;
        isDragging = true;
        const pos = getClientPos(e);
        startClientX = pos.clientX;
        startClientY = pos.clientY;
        initialXOffset = currentXOffset;
        
        // ジャンプ中でなければtransitionを消す
        if (!isJumping) characterContainer.style.transition = 'none';
        setWalking(true); // ドラッグ中は歩かせる
    }

    function handleDragMove(e) {
        if (!isDragging || !isDraggable) return;
        if(e.type === 'touchmove') e.preventDefault(); // スクロール防止
        
        const pos = getClientPos(e);
        const deltaX = pos.clientX - startClientX;
        const deltaY = pos.clientY - startClientY;
        
        // 【ジャンプ判定】
        // 上に40px以上、かつ横移動より縦移動が大きい（斜めではなく上に向かっている）場合に発動
        if (deltaY < -40 && Math.abs(deltaY) > Math.abs(deltaX) && !isJumping) {
            jump();
            startClientY = pos.clientY; // 着地まで連続発動しないように基準Yを更新
        }
        
        // 進む方向によってキャラクターを振り向かせる
        if (deltaX > 0 && direction === -1) {
            direction = 1;
            updateCharacterDirection();
        } else if (deltaX < 0 && direction === 1) {
            direction = -1;
            updateCharacterDirection();
        }
        
        // 画面外に完全に出ないように移動範囲を制限（Mathで1行に短縮）
        const limit = window.innerWidth / 2 - 30; 
        currentXOffset = Math.max(-limit, Math.min(limit, initialXOffset + deltaX));

        updateCharacterTransform();
    }

    function handleDragEnd() {
        if (!isDragging || !isDraggable) return;
        isDragging = false;
        setWalking(false); // ドラッグが終わったら止まる
    }

    // ==========================================
    // 初期ロード時のアニメーション
    // ==========================================
    async function initQuiz() {
        isDraggable = false;
        currentXOffset = 0;
        direction = 1;
        updateCharacterDirection();
        characterContainer.style.pointerEvents = 'none';

        characterContainer.style.display = "grid"; 
        characterContainer.style.transition = 'none';
        characterContainer.style.transform = 'translateX(-50%) translateX(-400px) translateY(0px)';

        await new Promise(resolve => setTimeout(resolve, 50));

        setWalking(true);

        characterContainer.style.transition = 'transform 3s linear';
        characterContainer.style.transform = 'translateX(-50%) translateX(0px) translateY(0px)';

        setTimeout(() => {
            setWalking(false); 
            const startBtn = document.getElementById('start-btn-element');
            const startTitle = document.getElementById('start-title-container');
            
            // 1. タイトル表示
            startTitle.style.display = 'block';
            setTimeout(() => {
                startTitle.classList.add('show');
            }, 50); 
            
            // 2. スタートボタン表示
            setTimeout(() => {
                startBtn.style.display = 'block';
                setTimeout(() => {
                    startBtn.classList.add('show');
                }, 50);
            }, 1200);

            // 定位置に到着後、キャラクターをドラッグ可能にする
            isDraggable = true;
            characterContainer.style.pointerEvents = 'auto';

        }, 3000);
    }

    // ==========================================
    // ステージ遷移のアニメーション
    // ==========================================
    async function transitionToNextStage(nextIndex) {
        const currentActiveBg = document.querySelector('.background-layer.active');
        const nextBg = (nextIndex < quizData.length) ? document.getElementById(`bg-${nextIndex + 1}`) : null;

        const isNextQuestion4 = (nextIndex === 3);
        const isLeavingQuestion4 = (currentQuestionIndex === 3);
        const isFinished = (nextIndex >= quizData.length);
        const isStartTransition = (nextIndex === 0);

        // 4問目の時だけオーバーレイの中心をくり抜く（スポットライト効果を1行で切り替え）
        document.querySelector('.overlay').classList.toggle('hole', isNextQuestion4);

        // --- 背景切り替え（キャラクター退場と同時に変化を始めるようにタイミングを前倒し） ---
        if (nextBg && nextBg !== currentActiveBg) {
            if (isStartTransition) {
                // スタート時は退場3秒＋登場3秒に合わせて、6秒かけて背景を切り替える
                if (currentActiveBg) currentActiveBg.classList.add('very-slow-transition');
                nextBg.classList.add('very-slow-transition');
            }
            nextBg.classList.add('active');
        } else if (isFinished) {
            const resultBg = document.getElementById('bg-6');
            if (resultBg && resultBg !== currentActiveBg) {
                // 最後の画面だけ3秒かけてゆっくり切り替わるようにクラスを付与
                if (currentActiveBg) currentActiveBg.classList.add('slow-transition');
                resultBg.classList.add('slow-transition');
                resultBg.classList.add('active');
            }
        }

        // --- 1. 退場アニメーション ---
        // 最終問題（5問目）クリア時にも退場アニメーションを実行させるために分岐を統合
        if (!isLeavingQuestion4) {
            setWalking(true);
            
            // どちらを向いていても強制的に右を向かせて退場させる
            direction = 1;
            updateCharacterDirection();

            await new Promise(resolve => setTimeout(resolve, 50));
            
            // スワイプで移動して遊んでいた場合を考慮して、現在地から確実に画面外へ出るように退場位置を計算
            const exitX = Math.max(400, currentXOffset + 400);

            // スタート時や最終問題クリア時は3秒、通常時は1.25秒で退場（処理を共通化して短縮）
            const duration = (isFinished || isStartTransition) ? 3.0 : 1.25;
            characterContainer.style.transition = `transform ${duration}s linear`;
            characterContainer.style.transform = `translateX(-50%) translateX(${exitX}px) translateY(0px)`;
            await new Promise(resolve => setTimeout(resolve, duration * 1000));
        } else {
            await new Promise(resolve => setTimeout(resolve, 1250));
        }

        // --- 2. 登場アニメーション ---
        if (!isFinished) {
            if (!isNextQuestion4) {
                currentXOffset = 0; // 次の登場位置を中央(0)にリセット
                direction = 1; // 右向きにリセット
                updateCharacterDirection();

                characterContainer.style.display = "grid";
                characterContainer.style.transition = 'none';
                characterContainer.style.transform = 'translateX(-50%) translateX(-400px)';

                await new Promise(resolve => setTimeout(resolve, 50));

                setWalking(true);

                // スタートからの1問目への登場は3秒、通常時は1.25秒で登場（処理を共通化）
                const duration = isStartTransition ? 3.0 : 1.25;
                characterContainer.style.transition = `transform ${duration}s linear`;
                characterContainer.style.transform = 'translateX(-50%) translateX(0px) translateY(0px)';
                await new Promise(resolve => setTimeout(resolve, duration * 1000));
            } else {
                characterContainer.style.display = "none";
                await new Promise(resolve => setTimeout(resolve, 1250));
            }
        }

        // --- 3. UIの表示と待機 ---
        if (currentActiveBg && currentActiveBg !== nextBg && nextBg !== null) {
            currentActiveBg.classList.remove('active');
            
            // スタート時のスローモーションクラスを次回以降に影響しないよう解除
            if (isStartTransition) {
                setTimeout(() => {
                    if(currentActiveBg) currentActiveBg.classList.remove('very-slow-transition');
                    if(nextBg) nextBg.classList.remove('very-slow-transition');
                }, 6000);
            }
        } else if (isFinished && currentActiveBg) {
             currentActiveBg.classList.remove('active');
        }
        
        // ここから下が確実に実行されることでクイズが開始します
        setWalking(false); 
        
        if (isFinished) {
            characterContainer.style.display = "none"; 
            completionScreen.classList.add('active');
        } else {
            currentQuestionIndex = nextIndex;
            loadQuestion(currentQuestionIndex);
            quizUiContainer.classList.add('active');

            // 第4問目（暗闇の演出でキャラ非表示）以外は、クイズ中もずっと遊べるようにする
            if (currentQuestionIndex !== 3) {
                isDraggable = true;
                characterContainer.style.pointerEvents = 'auto';
            }
        }
    }

    // ==========================================
    // UI操作関数
    // ==========================================
    function startQuiz() {
        isDraggable = false; // スタートを押したらドラッグ不可にする
        isJumping = false;   // 遊んでいる途中のジャンプを強制キャンセル
        currentYOffset = 0;
        characterContainer.style.pointerEvents = 'none';

        const startBtn = document.getElementById('start-btn-element');
        startBtn.classList.remove('show');
        
        // タイトルもフェードアウトさせる（より美しい演出のため）
        const startTitle = document.getElementById('start-title-container');
        if(startTitle) startTitle.classList.remove('show');

        setTimeout(() => {
            document.getElementById('start-screen').style.display = 'none';
            // スタート画面が消えたら、白オーバーレイも非表示にする
            const whiteOverlay = document.querySelector('.white-overlay');
            whiteOverlay.classList.add('hidden');
        }, 500);

        transitionToNextStage(0);
    }

    function loadQuestion(index) {
        const q = quizData[index];
        questionNumberEl.textContent = `第${q.qNum}問`;
        questionTextEl.innerHTML = q.question;

        if (index === 3) {
            characterContainer.style.display = "none";
        } else {
            characterContainer.style.transition = 'none';
            characterContainer.style.display = "grid"; 
            characterContainer.style.transform = 'translateX(-50%) translateX(0px) translateY(0px)';
        }
    }

    function answer(userChoice) {
        // 解答ボタンを押した瞬間に遊びを終了し、アニメーションのバグを防ぐ
        isDraggable = false; 
        isJumping = false;   

        const q = quizData[currentQuestionIndex];
        const isCorrect = (userChoice === q.answer);

        quizUiContainer.classList.remove('active');

        if (isCorrect) {
            modalTitle.textContent = "正解！";
            modalTitle.style.color = "#ef4444"; 
        } else {
            modalTitle.textContent = "残念...";
            modalTitle.style.color = "#3b82f6"; 
        }
        modalDesc.innerHTML = q.explanation;
        
        setTimeout(() => {
            resultModal.classList.add('active');
        }, 500); 
    }

    function nextQuestion() {
        resultModal.classList.remove('active');
        transitionToNextStage(currentQuestionIndex + 1);
    }

    window.onload = () => {
        initQuiz();
        
        // スワイプ（ドラッグ）イベントの登録
        characterContainer.addEventListener('touchstart', handleDragStart, { passive: false });
        characterContainer.addEventListener('touchmove', handleDragMove, { passive: false });
        characterContainer.addEventListener('touchend', handleDragEnd);
        
        // PCでのマウス操作にも対応
        characterContainer.addEventListener('mousedown', handleDragStart);
        window.addEventListener('mousemove', handleDragMove);
        window.addEventListener('mouseup', handleDragEnd);
    };

</script>
