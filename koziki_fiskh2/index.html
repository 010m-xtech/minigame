<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>居酒屋 乞食 のお魚たち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kinari: #F2EEE3;
    --kinari-deep: #E9E2CF;
    --ai: #22385C;
    --ai-light: #4C6A94;
    --ai-pale: #DCE3EC;
    --shu: #BD4630;
    --shu-pale: #F1DCD5;
    --sumi: #2A2620;
    --line: #D6CCB4;
    --muted: #a89d87;
    --font-mincho: 'Shippori Mincho', serif;
    --font-gothic: 'Zen Kaku Gothic New', sans-serif;
    --radius: 14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: #0d1b2a;
    color: var(--sumi);
    font-family: var(--font-gothic);
    -webkit-font-smoothing: antialiased;
  }

  body{ min-height:100vh; display:flex; justify-content:center; }

  /* ============ 背景動画(全画面共通・ループ再生) ============ */
  .bg-video-wrap{
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; background: #0d1b2a;
  }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out; /* 動画切り替え時のクロスフェード */
  }
  .bg-video-wrap video.show-bg {
    opacity: 1; /* アクティブな背景動画を表示 */
  }
  #bg-video-op {
    filter: brightness(2.5); /* オープニング動画の明るさをかなり明るく調整 */
  }
  .bg-video-overlay{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(13,27,42,0.72), rgba(13,27,42,0.85));
  }

  .app{
    width:100%; min-height:100vh;
    position:relative; z-index:1;
    display:flex; flex-direction:column;
  }

  header{
    position:sticky; top:0; z-index:20;
    background: transparent;
    border-bottom:1px solid rgba(242,238,227,0.15);
    padding: 16px 20px 14px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .seal{ width:32px; height:32px; flex:0 0 auto; object-fit: contain; }
  .brand h1{
    font-family: var(--font-mincho); font-weight:700; font-size:18.5px;
    letter-spacing:0.04em; margin:0; color:var(--kinari);
    line-height: 1.4;
  }
  .brand p{ margin:0; font-size:10px; color:rgba(242,238,227,0.6); letter-spacing:0.08em; }

  main{ flex:1; padding:26px 20px 48px; position:relative; }

  .screen{ display:none; animation: fadeUp .5s ease both; }
  .screen.active{ display:block; }
  .screen[data-screen="op"]{ animation: none; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  .eyebrow{ font-size:12px; letter-spacing:.14em; color:var(--shu-pale); font-weight:700; margin:0 0 8px; }
  h2.title{ font-family:var(--font-mincho); font-size:24px; line-height:1.6; margin:0 0 16px; color:var(--kinari); }
  .lead{ font-size:15px; color:rgba(242,238,227,0.85); line-height:1.9; margin:0 0 22px; }

  /* --- OP画面 --- */
  .op-wrapper {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .op-logo-img {
    opacity: 0; transition: opacity 1s ease-in-out;
    max-width: 250px; width: 60%; height: auto;
  }
  .skip-telop {
    position: absolute;
    bottom: 50px;
    left: 50%;
    color: rgba(242, 238, 227, 0.85);
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    white-space: nowrap;
    animation: floatBlink 3s ease-in-out infinite;
  }
  @keyframes floatBlink {
    0%, 100% {
      transform: translate(-50%, 0);
      opacity: 0.3;
    }
    50% {
      transform: translate(-50%, -10px);
      opacity: 1;
    }
  }

  /* --- 水槽アニメーション --- */
  .screen[data-screen="select"] {
    position: relative;
    min-height: 100vh;
    overflow: hidden; /* 画面外はみ出し分を隠す */
    padding: 0px 20px 0; /* 上部のパディングをなくして全体を上に移動 */
    margin-top: -12px; /* さらに上へ詰める */
  }
  .screen[data-screen="select"] > .eyebrow,
  .screen[data-screen="select"] > .title,
  .screen[data-screen="select"] > .lead {
    position: relative;
    z-index: 20; /* 魚よりも手前に表示 */
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); /* テキストを見やすく */
  }

  .aqua-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: visible; /* コンテナ外（画面外）の描画を許可 */
    pointer-events: none;
    z-index: 10;
  }
  .aqua-fish {
    position: absolute;
    top: 0; left: 0;
    width: 140px; /* アイコンを大きめに設定 */
    height: auto;
    cursor: pointer;
    pointer-events: auto; /* 魚自体はタップ可能 */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    transition: filter 0.2s;
    transform-origin: center center;
  }
  .aqua-fish:active {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)) brightness(1.2);
  }

  /* --- 魚詳細画面 --- */
  .fish-header{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px;
  }
  .fish-header .name{ font-family: var(--font-mincho); font-size:24px; font-weight:700; color: var(--kinari); }

  /* --- 魚のストーリー (読み物風) --- */
  .fish-story {
    background: rgba(242,238,227,0.04);
    border: 1px solid rgba(242,238,227,0.15);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    color: rgba(242,238,227,0.92);
  }
  .story-basic {
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 20px;
  }
  
  .story-highlight {
    margin: 0 -20px 20px;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(189,70,48,0.15), transparent);
    border-left: 4px solid var(--shu);
  }
  .highlight-title {
    font-family: var(--font-mincho);
    font-size: 16.5px;
    color: var(--shu-pale);
    margin: 0 0 8px;
    font-weight: 700;
  }
  .story-highlight p {
    font-size: 14px;
    line-height: 1.7;
    margin: 0;
  }

  /* --- 味わいと特徴 --- */
  .story-taste {
    margin: 0 0 24px;
  }
  .taste-title {
    font-family: var(--font-mincho);
    font-size: 15.5px;
    color: var(--kinari);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .taste-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--shu);
    transform: rotate(45deg);
  }
  .story-taste p {
    font-size: 14px;
    line-height: 1.8;
    margin: 0;
  }
  
  .story-trivia {
    background: rgba(34,56,92,0.4);
    border-radius: 8px;
    padding: 14px 16px;
    border: 1px solid rgba(76,106,148,0.3);
  }
  .trivia-label {
    font-size: 11px;
    color: var(--ai-pale);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .story-trivia p {
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
  }
  
  /* --- 豆知識用 イラスト (コード描画) --- */
  .trivia-illustration-wrap {
    margin-top: 16px;
    text-align: center;
    display: none; /* JSで切り替え */
  }
  .trivia-illustration-wrap img { /* SVGからimgに変更、スタイルを追加 */
    width: 100%;
    max-width: 260px;
    height: auto;
    border-radius: 6px;
    background: transparent; /* 背景を透明に */
    border: 1px solid rgba(220,227,236,0.15);
    margin: 0 auto;
    display: block;
  }

  .trivia-illustration-caption {
    font-size: 11px;
    color: var(--ai-pale);
    margin-top: 8px;
    opacity: 0.8;
  }

  h3.section-title{
    font-family: var(--font-mincho); font-size:15.5px; color: var(--kinari);
    margin: 30px 0 14px; display:flex; align-items:center; gap:8px;
  }
  h3.section-title::before{
    content:''; width:4px; height:14px; background: var(--shu); border-radius:2px; display:inline-block;
  }

  /* --- メニューアイテム --- */
  .menu-item{
    background: rgba(242,238,227,0.06);
    border:1px solid rgba(242,238,227,0.18);
    border-radius: 10px;
    padding: 16px;
    margin-bottom:12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .menu-item:hover{ background: rgba(242,238,227,0.1); }
  .menu-item .name{ font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); display: flex; justify-content: space-between; align-items: center; }
  .menu-item .chevron { transition: transform 0.3s ease; opacity: 0.6; }
  .menu-item.open .chevron { transform: rotate(180deg); }
  .menu-item .desc{ font-size:13px; color: rgba(242,238,227,0.7); margin-top:6px; line-height:1.6; }
  
  .pairing-sake {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed rgba(242,238,227,0.2);
  }
  .menu-item.open .pairing-sake {
    display: block;
    animation: fadeInSake 0.3s ease both;
  }
  @keyframes fadeInSake { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  /* --- お酒の提案 --- */
  .sake-group-label{
    font-size:11.5px; font-weight:700; color: var(--shu-pale);
    letter-spacing:.06em; margin: 18px 0 10px;
    display:flex; align-items:center; gap:6px;
  }
  .sake-card{
    background: rgba(242,238,227,0.08);
    border:1px solid rgba(242,238,227,0.2);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom:12px;
  }
  .sake-card .tag{
    display:inline-block; font-size:10.5px; font-weight:700;
    background: var(--shu); color:#fff; padding:2px 9px; border-radius:20px;
    margin-bottom:8px;
  }
  .sake-card .name-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .sake-card .name{ font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); }
  .sake-card .region{ font-size:11px; color: rgba(242,238,227,0.55); }
  .sake-card .taste{ font-size:12.5px; color: rgba(242,238,227,0.85); line-height:1.75; margin:0; }

  .btn-row{ display:flex; gap:10px; margin-top:30px; }
  button.btn{
    font-family:var(--font-gothic); font-weight:700; font-size:14px;
    padding:14px 18px; border-radius:10px; border:none; cursor:pointer;
    letter-spacing:.03em; transition:opacity .15s ease, transform .1s ease;
  }
  button.btn:active{ transform:scale(0.98); }
  button.btn:focus-visible{ outline:2px solid var(--shu-pale); outline-offset:2px; }
  .btn-primary{ flex:1; background:var(--shu); color:#fff; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background: rgba(242,238,227,0.08); color:var(--kinari); border:1px solid rgba(242,238,227,0.3); }

  /* --- 汎用パーツ(プロフィール・アンケート) --- */
  .radio-buttons{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-btn-wrap{ flex:1; min-width:84px; cursor:pointer; }
  .radio-btn-wrap input{ display:none; }
  .radio-box{
    display:flex; align-items:center; justify-content:center; padding:12px 0;
    border:1px solid rgba(242,238,227,0.3); background: rgba(242,238,227,0.05); border-radius:8px;
    font-size:13px; font-weight:700; color: rgba(242,238,227,0.75); transition:all .2s ease;
  }
  .radio-box::before{
    content:''; display:inline-block; width:14px; height:14px; border-radius:50%;
    border:1px solid rgba(242,238,227,0.4); margin-right:6px; transition:all .2s ease;
  }
  .radio-btn-wrap input:checked + .radio-box{ background: var(--shu); border-color: var(--shu); color:#fff; }
  .radio-btn-wrap input:checked + .radio-box::before{ border-width:4px; border-color:#fff; background: var(--shu); }
  .radio-group-error{ color: var(--shu-pale); font-size:12.5px; font-weight:700; margin:-14px 0 20px; display:none; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-4px);} 40%,80%{transform:translateX(4px);} }
  .shake{ animation: shake .4s ease; }
  .errhi .radio-box{ border-color: var(--shu-pale); background: rgba(189,70,48,0.25); }

  .radio-buttons-col{ display:flex; flex-direction:column; gap:8px; }
  .radio-buttons-col .radio-box{ justify-content:flex-start; padding:12px 16px; font-size:13.5px; text-align:left; }

  .profile-group{ margin-bottom:24px; }
  .profile-group > label{ display:block; font-size:12.5px; font-weight:700; color: var(--kinari); margin-bottom:10px; }

  .note{ font-size:10.5px; color: rgba(242,238,227,0.5); margin-top:10px; line-height:1.6; text-align:center; }

  .stamp-wrap{ display:flex; justify-content:center; margin:14px 0 24px; }
  .stamp{ width:96px; height:96px; animation: stampIn .6s cubic-bezier(.2,1.4,.4,1) both; }
  @media (prefers-reduced-motion: reduce){ .stamp{ animation:none; } }
  @keyframes stampIn{
    0%{ opacity:0; transform:scale(2.2) rotate(-18deg); }
    70%{ opacity:1; }
    100%{ opacity:1; transform:scale(1) rotate(-8deg); }
  }

  .center-text{ text-align:center; }
</style>
</head>
<body>

<div class="bg-video-wrap">
  <!-- オープニング画面用背景動画 (初期表示で表示状態 class="show-bg") -->
  <video id="bg-video-op" class="show-bg" autoplay muted playsinline>
    <source src="title3.mp4" type="video/mp4">
  </video>
  <!-- その他の画面用背景動画 (クロスフェードで擬似シームレスループ用) -->
  <video id="bg-video-main-1" muted playsinline>
    <source src="back.mp4" type="video/mp4">
  </video>
  <video id="bg-video-main-2" muted playsinline>
    <source src="back.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay"></div>
</div>

<div class="app">
  <header id="main-header" style="display: none;">
    <div class="brand">
      <img src="koziki_logo.png" class="seal" alt="居酒屋 乞食 ロゴ">
      <div>
        <h1>居酒屋 乞食 のお魚たち</h1>
      </div>
    </div>
  </header>
  <main>

    <!-- Screen: オープニング -->
    <section class="screen active" data-screen="op" onclick="goScreen('select')">
      <div class="op-wrapper">
        <img src="koziki_title.png" id="op-logo" class="op-logo-img" alt="居酒屋 乞食">
        <p class="skip-telop">画面をタップしてスキップ</p>
      </div>
    </section>

    <!-- Screen: サカナ選択 -->
    <!-- 修正箇所：タイトルを1行で表示し、画面幅に合わせて自動調整されるように修正 -->
    <section class="screen" data-screen="select">
      <h2 class="title" style="font-size: clamp(16px, 5.5vw, 28px); white-space: nowrap; letter-spacing: -0.04em;">魚をタップして捕まえてみてください</h2>
      <p class="lead" style="font-size: 15px;">
        居酒屋 乞食の新鮮なお魚たち。
        <span style="display: block; margin-top: 10px;"></span>
        捕まえたお魚の豆知識と、<br>相性抜群の日本酒をご提案します。
      </p>
      <div class="aqua-wrap" id="aquaWrap"></div>
    </section>

    <!-- Screen: 魚詳細(情報+メニュー枠+お酒提案) -->
    <section class="screen" data-screen="detail">
      <div class="fish-header">
        <span class="name" id="detailName"></span>
      </div>

      <article class="fish-story">
        <p class="story-basic" id="detailBasic"></p>
        
        <div class="story-taste">
          <h4 class="taste-title">味わいと食べるポイント</h4>
          <p id="detailEatingPoint"></p>
        </div>

        <div class="story-highlight">
          <h4 class="highlight-title">実は…</h4>
          <p id="detailSurprising"></p>
        </div>
        
        <div class="story-trivia">
          <div class="trivia-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            豆知識
          </div>
          <p id="detailTrivia"></p>
          
          <!-- イラスト(SVG)描画エリア -->
          <div class="trivia-illustration-wrap" id="detailIllWrap">
            <div id="detailIllSvg"></div>
            <div class="trivia-illustration-caption" id="detailIllCaption"></div>
          </div>
        </div>
      </article>

      <button class="btn btn-ghost" style="width: 100%; margin-top: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;" onclick="goToMenu()">
        <span>この魚を使ったメニューを見る</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div class="btn-row">
        <button class="btn btn-primary" style="width:100%" id="finishButton" onclick="handleFinishClick()"></button>
      </div>
    </section>

    <!-- Screen: メニュー一覧 -->
    <section class="screen" data-screen="menu">
      <p class="eyebrow">MENU</p>
      <h2 class="title"><span id="menuScreenName"></span> のメニュー</h2>
      
      <div id="menuScreenList">
        <!-- JSでメニューが生成される -->
      </div>

      <div class="btn-row" style="margin-top: 32px;">
        <button class="btn btn-ghost" style="width:100%" onclick="goScreen('detail')">魚の詳細に戻る</button>
      </div>
    </section>

    <!-- Screen: お酒一覧 -->
    <section class="screen" data-screen="sake">
      <p class="eyebrow">SAKE</p>
      <h2 class="title"><span id="sakeScreenName"></span> に合うお酒</h2>
      
      <div id="sakeScreenList">
        <!-- JSでお酒が生成される -->
      </div>

      <div class="btn-row" style="margin-top: 32px;">
        <button class="btn btn-ghost" style="width:100%" onclick="goScreen('detail')">魚の詳細に戻る</button>
      </div>
    </section>

    <!-- Screen: アンケート(初回のみ) -->
    <section class="screen" data-screen="survey">
      <p class="eyebrow">LAST STEP</p>
      <h2 class="title">最後にお聞かせください</h2>
      <p class="lead">(初回のみ・次回からは表示されません)</p>

      <div class="profile-group" id="group-gender">
        <label>性別</label>
        <div class="radio-buttons">
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="男性" onchange="clearErr('group-gender')"><span class="radio-box">男性</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="女性" onchange="clearErr('group-gender')"><span class="radio-box">女性</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="無回答" onchange="clearErr('group-gender')"><span class="radio-box" style="font-size:12px;">無回答</span></label>
        </div>
      </div>

      <div class="profile-group" id="group-age">
        <label>年齢</label>
        <div class="radio-buttons">
          <label class="radio-btn-wrap"><input type="radio" name="s-age" value="34歳以下" onchange="clearErr('group-age')"><span class="radio-box">34歳以下</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-age" value="35歳以上" onchange="clearErr('group-age')"><span class="radio-box">35歳以上</span></label>
        </div>
      </div>

      <p class="radio-group-error" id="surveyError">すべての項目にご回答ください</p>
      <p class="note">※サービス改善のための参考にさせていただきます</p>

      <div class="btn-row">
        <button class="btn btn-primary" style="width:100%" onclick="submitSurvey()">終了する</button>
      </div>
    </section>

  </main>

</div>

<script>
/* ============ ログ送信設定 ============ */
const GAS_URL = 'YOUR_GAS_WEBHOOK_URL_HERE';

function sendLog(action, extra) {
  const payload = Object.assign({
    deviceId: fishDeviceId,
    action: action
  }, extra || {});
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)

/* ============ 画面遷移と背景切り替え ============ */
let isMainVideoPlaying = false;

function startSeamlessLoop() {
  if (isMainVideoPlaying) return;
  isMainVideoPlaying = true;
  
  const vid1 = document.getElementById('bg-video-main-1');
  const vid2 = document.getElementById('bg-video-main-2');
  const fadeTime = 1.5; // 動画終了の何秒前にクロスフェードを開始するか

  if (!vid1 || !vid2) return;

  vid1.currentTime = 0;
  vid1.play().catch(e => console.log('Video play error:', e));
  vid1.classList.add('show-bg');

  const checkTime = (currentVid, nextVid) => {
    if (currentVid.duration > 0 && currentVid.currentTime >= currentVid.duration - fadeTime) {
      if (nextVid.paused) {
        nextVid.currentTime = 0;
        nextVid.play().catch(e => console.log('Video play error:', e));
        nextVid.classList.add('show-bg');
        currentVid.classList.remove('show-bg');
      }
    }
    if (currentVid.currentTime >= currentVid.duration - 0.2) {
      currentVid.pause();
    }
  };

  vid1.addEventListener('timeupdate', () => checkTime(vid1, vid2));
  vid2.addEventListener('timeupdate', () => checkTime(vid2, vid1));
}

function goScreen(name){
  document.querySelectorAll('.screen').forEach(el=>{
    el.classList.toggle('active', el.dataset.screen === name);
  });
  window.scrollTo({top:0, behavior:'smooth'});

  const opVideo = document.getElementById('bg-video-op');
  const header = document.getElementById('main-header');
  
  if(name === 'op') {
    if(opVideo) opVideo.classList.add('show-bg');
    if(header) header.style.display = 'none';
  } else {
    if(opVideo) opVideo.classList.remove('show-bg');
    startSeamlessLoop();
    if(header) header.style.display = 'block';
  }

  // アニメーションのオンオフ制御
  if (name === 'select') {
    startAquarium();
  } else {
    stopAquarium();
  }
}

/* ============ 水槽アニメーション ============ */
let aquaFishes = [];
let aquaAnimId = null;

function startAquarium() {
  if (aquaAnimId) return; // 既に動いていればスキップ
  
  const wrap = document.getElementById('aquaWrap');
  if (!wrap) return;

  // 初回のみ要素を生成
  if (aquaFishes.length === 0) {
    wrap.innerHTML = '';
    fishList.forEach((f) => {
      const img = document.createElement('img');
      img.src = f.img;
      img.className = 'aqua-fish';
      img.alt = f.name;
      img.onclick = () => selectFish(f.id);
      wrap.appendChild(img);

      aquaFishes.push({
        id: f.id,
        el: img,
        x: Math.random() * (window.innerWidth || 400),
        y: Math.random() * ((window.innerHeight || 800) - 200) + 100,
        vx: (Math.random() - 0.5) * 2, // 速度X
        vy: (Math.random() - 0.5) * 1, // 速度Y
        targetVx: 0,
        targetVy: 0,
        time: Math.random() * 100,
        isDashing: false
      });
    });
  }

  let lastTime = performance.now();

  function animate(now) {
    const dt = Math.min((now - lastTime) / 16.6, 2); // コマ落ち対策
    lastTime = now;

    const w = window.innerWidth;
    const h = window.innerHeight;
    const marginX = 150; // 画面外に出る余裕
    const marginY = 150;

    aquaFishes.forEach(f => {
      f.time += dt;

      // カツオの猛ダッシュ処理
      if (f.id === 'katsuo') {
        if (!f.isDashing && Math.random() < 0.0002 * dt) { // 稀にダッシュ (確率を大幅に下げる)
          f.isDashing = true;
          // 画面を横切るくらいの超高速ダッシュに設定
          f.targetVx = (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 30); 
          f.targetVy = (Math.random() - 0.5) * 15;
        } else if (f.isDashing && Math.random() < 0.015 * dt) { // しばらくしたら落ち着く
          f.isDashing = false;
        }
      }

      // 通常のランダムな速度変化（ダッシュ中以外）
      if (!f.isDashing && f.time > 100) {
        f.targetVx = (Math.random() - 0.5) * 2;
        f.targetVy = (Math.random() - 0.5) * 1;
        f.time = 0;
      }

      // 目標速度へ滑らかに近づく (ダッシュ時はより急加速させる)
      f.vx += (f.targetVx - f.vx) * (f.isDashing ? 0.4 : 0.02) * dt;
      f.vy += (f.targetVy - f.vy) * (f.isDashing ? 0.4 : 0.02) * dt;

      // 座標更新
      f.x += f.vx * dt;
      f.y += f.vy * dt;

      // 画面外（マージン）に出たら跳ね返る
      if (f.x < -marginX) { f.x = -marginX; f.vx *= -1; f.targetVx *= -1; }
      if (f.x > w + marginX) { f.x = w + marginX; f.vx *= -1; f.targetVx *= -1; }
      if (f.y < -marginY) { f.y = -marginY; f.vy *= -1; f.targetVy *= -1; }
      if (f.y > h + marginY) { f.y = h + marginY; f.vy *= -1; f.targetVy *= -1; }

      // 進行方向に向きを変える (画像はデフォルト左向きと仮定、右に進む場合は反転)
      const scaleX = f.vx > 0 ? -1 : 1;
      
      f.el.style.transform = `translate(${f.x}px, ${f.y}px) scaleX(${scaleX})`;
    });

    aquaAnimId = requestAnimationFrame(animate);
  }

  aquaAnimId = requestAnimationFrame(animate);
}

function stopAquarium() {
  if (aquaAnimId) {
    cancelAnimationFrame(aquaAnimId);
    aquaAnimId = null;
  }
}

  const items = f.menuItems && f.menuItems.length > 0 ? f.menuItems : [
    { name: `${f.name}のお造り`, description: "鮮度抜群。素材本来の味をお楽しみください。", recommendedSake: f.recommendedSake },
    { name: `${f.name}の特製なめろう`, description: "日本酒にぴったり。ちびちびとつまめる一品です。", recommendedSake: "zaku" },
    { name: `${f.name}の炭火焼き`, description: "香ばしい香りが食欲をそそります。", recommendedSake: "tateyama" }
  ];

  wrap.innerHTML = items.map(m => {
    const s = sakeList.find(sake => sake.id === m.recommendedSake);
    let sakeHtml = '';
    if (s) {
      sakeHtml = `
        <div class="pairing-sake">
          <div class="sake-group-label" style="margin-top:0;">おすすめのペアリング</div>
          <div class="sake-card" style="margin-bottom:0; background: rgba(0,0,0,0.15);">
            <span class="tag">${s.tag}</span>
            <div class="name-row">
              <span class="name">${s.name}</span>
              <span class="region">〈${s.region}〉</span>
            </div>
            <p class="taste">${s.taste}</p>
          </div>
        </div>
      `;
    }

    return `
      <div class="menu-item" onclick="this.classList.toggle('open')">
        <div class="name">
          ${m.name}
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="desc">${m.description}</div>
        ${sakeHtml}
      </div>
    `;
  }).join('');

  goScreen('menu');
}

/* ============ アンケートへ進む、または直接終了する ============ */
function handleFinishClick(){
  if (surveyProfile) {
    goScreen('select');
  } else {
    goScreen('survey');
  }
}

/* ============ アンケート送信 ============ */
function submitSurvey(){
  const genderEl = document.querySelector('input[name="s-gender"]:checked');
  const ageEl = document.querySelector('input[name="s-age"]:checked');
  const errorEl = document.getElementById('surveyError');

  let hasError = false;
  if (!genderEl) { document.getElementById('group-gender').classList.add('errhi'); hasError = true; }
  if (!ageEl) { document.getElementById('group-age').classList.add('errhi'); hasError = true; }

  if (hasError) {
    errorEl.style.display = 'block';
    errorEl.classList.remove('shake'); void errorEl.offsetWidth; errorEl.classList.add('shake');
    return;
  }
  errorEl.style.display = 'none';

  surveyProfile = { gender: genderEl.value, age: ageEl.value };
  localStorage.setItem('fish_survey', JSON.stringify(surveyProfile));

  sendLog('アンケート回答', {
    gender: genderEl.value,
    age: ageEl.value,
    fishId: currentFishId
  });

  goScreen('select');
}

/* ============ 初期化 ============ */
goScreen('op');
sendLog('アクセス');

/* ============ OP動画終了イベント ============ */
const opVid = document.getElementById('bg-video-op');
const opLogo = document.getElementById('op-logo');
if (opVid && opLogo) {
  opVid.addEventListener('ended', () => {
    opLogo.style.opacity = '1';
    
    setTimeout(() => {
      const opScreen = document.querySelector('[data-screen="op"]');
      if (opScreen.classList.contains('active')) {
        goScreen('select');
      }
    }, 3000);
  });
}
</script>
