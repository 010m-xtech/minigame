<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>居酒屋 乞食 のお魚たち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --kinari: #FFFFFF;
    --kinari-deep: #E9E2CF;
    --ai: #22385C;
    --ai-light: #4C6A94;
    --ai-pale: #DCE3EC;
    --shu: #BD4630;
    --shu-pale: #F1DCD5;
    --sumi: #2A2620;
    --line: #D6CCB4;
    --muted: #a89d87;
    --font-mincho: 'Shippori Mincho', serif;
    --font-gothic: 'Zen Kaku Gothic New', sans-serif;
    --radius: 14px;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    margin:0; padding:0;
    background: #0d1b2a;
    color: #FFFFFF;
    font-family: var(--font-gothic);
    -webkit-font-smoothing: antialiased;
  }

  body { min-height:100vh; display:flex; justify-content:center; }

  /* ============ 背景動画(全画面共通・ループ再生) ============ */
  .bg-video-wrap {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; background: #0d1b2a;
  }
  .bg-video-wrap video {
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .bg-video-wrap video.show-bg { opacity: 1; }
  #bg-video-op { filter: brightness(2.5); }
  .bg-video-overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(13,27,42,0.72), rgba(13,27,42,0.85));
  }

  .app {
    width:100%; max-width:460px; min-height:100vh;
    position:relative; z-index:1;
    display:flex; flex-direction:column;
  }

  header {
    position:sticky; top:0; z-index:20;
    /* 背景色を少し透過させた暗い色にし、すりガラス効果を追加して文字被りを防ぐ */
    background: rgba(13, 27, 42, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.15);
    padding: 16px 20px 14px;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .seal { width:32px; height:32px; flex:0 0 auto; object-fit: contain; }
  .brand h1 {
    font-family: var(--font-mincho); font-weight:700; font-size:18.5px;
    letter-spacing:0.04em; margin:0; color:var(--kinari);
    line-height: 1.4;
  }
  .brand p { margin:0; font-size:10px; color:rgba(255,255,255,0.7); letter-spacing:0.08em; }

  main { flex:1; padding:26px 20px 48px; position:relative; }

  .screen { display:none; animation: fadeUp .5s ease both; }
  .screen.active { display:block; }
  .screen[data-screen="op"] { animation: none; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  .eyebrow { font-size:12px; letter-spacing:.14em; color:var(--shu-pale); font-weight:700; margin:0 0 8px; }
  h2.title { font-family:var(--font-mincho); font-size:24px; line-height:1.6; margin:0 0 16px; color:var(--kinari); }
  .lead { font-size:15px; color:#FFFFFF; line-height:1.9; margin:0 0 22px; }

  /* --- OP画面 --- */
  .op-wrapper {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .op-logo-img {
    opacity: 0; transition: opacity 1s ease-in-out;
    max-width: 250px; width: 60%; height: auto;
  }
  .skip-telop {
    position: absolute; bottom: 50px; left: 50%;
    color: rgba(255, 255, 255, 0.85); font-size: 13px;
    letter-spacing: 0.1em; pointer-events: none;
    white-space: nowrap; animation: floatBlink 3s ease-in-out infinite;
  }
  @keyframes floatBlink {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.3; }
    50% { transform: translate(-50%, -10px); opacity: 1; }
  }

  /* --- 魚選択（グリッド） --- */
  .fish-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin-top: 24px;
  }
  .fish-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
    border-radius: var(--radius); padding: 20px 10px 16px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; transition: all 0.2s ease; text-align: center;
  }
  .fish-card:hover, .fish-card:active {
    background: rgba(255,255,255,0.12); transform: translateY(-2px);
  }
  .fish-card img {
    width: auto; height: auto; max-width: 100px; max-height: 70px;
    object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  .fish-card .name { font-family: var(--font-mincho); font-size: 16px; font-weight: 700; color: var(--kinari); }

  /* --- 魚詳細画面 --- */
  .fish-header { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .fish-header .name { font-family: var(--font-mincho); font-size:24px; font-weight:700; color: var(--kinari); }

  .fish-story {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius); padding: 20px;
    margin-bottom: 24px; color: #FFFFFF;
  }
  .story-basic { font-size: 14px; line-height: 1.8; margin: 0 0 20px; }
  
  .story-taste { margin: 0 0 24px; }
  .taste-title {
    font-family: var(--font-mincho); font-size: 15.5px; color: var(--kinari);
    margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .taste-title::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    background: var(--shu); transform: rotate(45deg);
  }
  .story-taste p { font-size: 14px; line-height: 1.8; margin: 0; }

  /* --- クイズUI --- */
  .quiz-container {
    background: rgba(34,56,92,0.4); border: 1px solid rgba(76,106,148,0.3);
    border-radius: var(--radius); padding: 18px 20px;
    margin-bottom: 8px;
  }
  .quiz-question {
    font-family: var(--font-mincho); font-size: 16.5px; font-weight: 700;
    line-height: 1.6; margin-bottom: 16px; color: var(--kinari);
  }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
    padding: 14px 16px; border-radius: 8px; color: #fff;
    font-family: var(--font-gothic); font-size: 14px; font-weight: 700;
    text-align: left; cursor: pointer; transition: all 0.2s; line-height: 1.4;
  }
  .quiz-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
  .quiz-btn:disabled { opacity: 0.9; cursor: default; }
  .quiz-btn.correct { background: rgba(46, 139, 87, 0.4); border-color: #55a878; color: #fff; }
  .quiz-btn.incorrect { background: rgba(189, 70, 48, 0.4); border-color: var(--shu); opacity: 0.7; }

  /* --- フリップカードUI --- */
  .flip-card-container {
    perspective: 1000px; width: 100%; margin-bottom: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .flip-card {
    position: relative; width: 100%;
    transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    display: grid;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .flip-card-front {
    background: linear-gradient(135deg, rgba(34,56,92,0.9), rgba(13,27,42,0.9));
    border: 1px solid rgba(76,106,148,0.5);
  }
  .flip-card-back {
    background: linear-gradient(135deg, rgba(189,70,48,0.95), rgba(120,30,20,0.95));
    border: 1px solid var(--shu-pale);
    transform: rotateY(180deg);
  }

  /* --- 豆知識・解説エリア (共通) --- */
  .story-trivia {
    background: rgba(34,56,92,0.2); border-radius: 8px;
    padding: 14px 16px; border: 1px dashed rgba(76,106,148,0.4);
  }
  .trivia-label {
    font-size: 11px; color: #FFFFFF; font-weight: 700;
    letter-spacing: 0.1em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .story-trivia p { font-size: 13px; line-height: 1.7; margin: 0; }
  
  .trivia-illustration-wrap { margin-top: 16px; text-align: center; display: none; }
  .trivia-illustration-wrap img {
    width: 100%; max-width: 260px; height: auto; border-radius: 6px;
    background: transparent; border: 1px solid rgba(220,227,236,0.15);
    margin: 0 auto; display: block;
  }
  .trivia-illustration-caption { font-size: 11px; color: #FFFFFF; margin-top: 8px; }

  h3.section-title {
    font-family: var(--font-mincho); font-size:15.5px; color: var(--kinari);
    margin: 30px 0 14px; display:flex; align-items:center; gap:8px;
  }
  h3.section-title::before { content:''; width:4px; height:14px; background: var(--shu); border-radius:2px; display:inline-block; }

  /* --- メニューアイテム --- */
  .menu-item {
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
    border-radius: 10px; padding: 16px; margin-bottom:12px; cursor: pointer; transition: background 0.2s ease;
  }
  .menu-item:hover { background: rgba(255,255,255,0.1); }
  .menu-item .name { font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); display: flex; justify-content: space-between; align-items: center; }
  .menu-item .chevron { transition: transform 0.3s ease; opacity: 0.6; }
  .menu-item.open .chevron { transform: rotate(180deg); }
  .menu-item .desc { font-size:13px; color: #FFFFFF; margin-top:6px; line-height:1.6; }
  
  .pairing-sake { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,0.2); }
  .menu-item.open .pairing-sake { display: block; animation: fadeInSake 0.3s ease both; }
  @keyframes fadeInSake { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  /* --- お酒の提案 --- */
  .sake-group-label {
    font-size:11.5px; font-weight:700; color: var(--shu-pale);
    letter-spacing:.06em; margin: 18px 0 10px; display:flex; align-items:center; gap:6px;
  }
  .sake-card {
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom:12px;
  }
  .sake-card .tag {
    display:inline-block; font-size:10.5px; font-weight:700;
    background: var(--shu); color:#fff; padding:2px 9px; border-radius:20px; margin-bottom:8px;
  }
  .sake-card .name-row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .sake-card .name { font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); }
  .sake-card .region { font-size:11px; color: #FFFFFF; }
  .sake-card .taste { font-size:12.5px; color: #FFFFFF; line-height:1.75; margin:0; }

  .btn-row { display:flex; gap:10px; margin-top:30px; }
  button.btn {
    font-family:var(--font-gothic); font-weight:700; font-size:14px;
    padding:14px 18px; border-radius:10px; border:none; cursor:pointer;
    letter-spacing:.03em; transition:opacity .15s ease, transform .1s ease;
  }
  button.btn:active { transform:scale(0.98); }
  button.btn:focus-visible { outline:2px solid var(--shu-pale); outline-offset:2px; }
  .btn-primary { flex:1; background:var(--shu); color:#fff; }
  .btn-primary:hover { opacity:.92; }
  .btn-ghost { background: rgba(255,255,255,0.08); color:var(--kinari); border:1px solid rgba(255,255,255,0.3); }

  /* --- 汎用パーツ(プロフィール・アンケート) --- */
  .radio-buttons { display:flex; gap:8px; flex-wrap:wrap; }
  .radio-btn-wrap { flex:1; min-width:84px; cursor:pointer; }
  .radio-btn-wrap input { display:none; }
  .radio-box {
    display:flex; align-items:center; justify-content:center; padding:12px 0;
    border:1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); border-radius:8px;
    font-size:13px; font-weight:700; color: #FFFFFF; transition:all .2s ease;
  }
  .radio-box::before {
    content:''; display:inline-block; width:14px; height:14px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.4); margin-right:6px; transition:all .2s ease;
  }
  .radio-btn-wrap input:checked + .radio-box { background: var(--shu); border-color: var(--shu); color:#fff; }
  .radio-btn-wrap input:checked + .radio-box::before { border-width:4px; border-color:#fff; background: var(--shu); }
  .radio-group-error { color: var(--shu-pale); font-size:12.5px; font-weight:700; margin:-14px 0 20px; display:none; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-4px);} 40%,80%{transform:translateX(4px);} }
  .shake { animation: shake .4s ease; }
  .errhi .radio-box { border-color: var(--shu-pale); background: rgba(189,70,48,0.25); }

  .profile-group { margin-bottom:24px; }
  .profile-group > label { display:block; font-size:12.5px; font-weight:700; color: var(--kinari); margin-bottom:10px; }

  .note { font-size:10.5px; color: #FFFFFF; margin-top:10px; line-height:1.6; text-align:center; }
  .center-text { text-align:center; }
</style>
</head>
<body>

<div class="bg-video-wrap">
  <video id="bg-video-op" class="show-bg" autoplay muted playsinline>
    <source src="title3.mp4" type="video/mp4">
  </video>
  <video id="bg-video-main-1" muted playsinline>
    <source src="back.mp4" type="video/mp4">
  </video>
  <video id="bg-video-main-2" muted playsinline>
    <source src="back.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay"></div>
</div>

<div class="app">
  <header id="main-header" style="display: none;">
    <div class="brand">
      <img src="koziki_logo.png" class="seal" alt="居酒屋 乞食 ロゴ" onerror="this.src='https://placehold.co/64x64/22385C/FFFFFF?text=ロゴ'">
      <div>
        <h1>居酒屋 乞食 のお魚たち</h1>
      </div>
    </div>
  </header>
  <main>

    <!-- Screen: オープニング -->
    <section class="screen active" data-screen="op" onclick="goScreen('select')">
      <div class="op-wrapper">
        <img src="koziki_title.png" id="op-logo" class="op-logo-img" alt="居酒屋 乞食" onerror="this.src='https://placehold.co/400x200/transparent/FFFFFF?text=居酒屋+乞食'">
        <p class="skip-telop">画面をタップしてスキップ</p>
      </div>
    </section>

    <!-- Screen: サカナ選択 -->
    <section class="screen" data-screen="select">
      <h2 class="title" style="font-size: 26px;">気になる魚を選んでください</h2>
      <p class="lead" style="font-size: 16px;">
        居酒屋 乞食の新鮮なお魚たち。<br>
        <span style="display: inline-block; margin-top: 8px;">
          選んだお魚の豆知識と、<br>相性抜群の日本酒をご提案します。
        </span>
      </p>
      <div class="fish-grid" id="fishGrid"></div>
    </section>

    <!-- Screen: 魚詳細(情報+メニュー枠+お酒提案) -->
    <section class="screen" data-screen="detail">
      <div class="fish-header">
        <span class="name" id="detailName"></span>
      </div>

      <article class="fish-story">
        <p class="story-basic" id="detailBasic"></p>
        
        <div class="story-taste">
          <h4 class="taste-title">味わいと食べるポイント</h4>
          <p id="detailEatingPoint"></p>
        </div>

        <!-- インタラクティブUIエリア (クイズ または フリップカード) -->
        <div id="interactiveArea"></div>
        
        <!-- 解説・豆知識表示エリア (インタラクション後に表示) -->
        <div class="story-trivia" id="explanationArea" style="display: none; margin-top: 24px;">
          <div class="trivia-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            さらに詳しく
          </div>
          <p id="detailExplanation"></p>
          
          <div class="trivia-illustration-wrap" id="detailIllWrap">
            <div id="detailIllSvg"></div>
            <div class="trivia-illustration-caption" id="detailIllCaption"></div>
          </div>
        </div>
      </article>

      <div class="btn-row" style="margin-bottom: 24px;">
        <button class="btn btn-primary" style="width: 100%; display: flex; justify-content: space-between; align-items: center;" onclick="goToMenu()">
          <span>この魚を使ったメニューを見る</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- Screen: メニュー一覧 -->
    <section class="screen" data-screen="menu">
      <h2 class="title"><span id="menuScreenName"></span> を使用した料理と相性良いお酒</h2>
      <div id="menuScreenList"></div>
      <div class="btn-row" style="margin-top: 32px;">
        <button class="btn btn-primary" style="width:100%" id="finishButton" onclick="handleFinishClick()"></button>
      </div>
    </section>

    <!-- Screen: アンケート(初回のみ) -->
    <section class="screen" data-screen="survey">
      <p class="eyebrow">LAST STEP</p>
      <h2 class="title">最後にお聞かせください</h2>
      <p class="lead">(初回のみ・次回からは表示されません)</p>
      <div class="profile-group" id="group-gender">
        <label>性別</label>
        <div class="radio-buttons">
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="男性" onchange="clearErr('group-gender')"><span class="radio-box">男性</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="女性" onchange="clearErr('group-gender')"><span class="radio-box">女性</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-gender" value="無回答" onchange="clearErr('group-gender')"><span class="radio-box" style="font-size:12px;">無回答</span></label>
        </div>
      </div>
      <div class="profile-group" id="group-age">
        <label>年齢</label>
        <div class="radio-buttons">
          <label class="radio-btn-wrap"><input type="radio" name="s-age" value="34歳以下" onchange="clearErr('group-age')"><span class="radio-box">34歳以下</span></label>
          <label class="radio-btn-wrap"><input type="radio" name="s-age" value="35歳以上" onchange="clearErr('group-age')"><span class="radio-box">35歳以上</span></label>
        </div>
      </div>
      <p class="radio-group-error" id="surveyError">すべての項目にご回答ください</p>
      <p class="note">※サービス改善のための参考にさせていただきます</p>
      <div class="btn-row">
        <button class="btn btn-primary" style="width:100%" onclick="submitSurvey()">終了する</button>
      </div>
    </section>

  </main>
</div>

<script>
const GAS_URL = 'YOUR_GAS_WEBHOOK_URL_HERE';

function sendLog(action, extra) {
  const payload = Object.assign({
    deviceId: fishDeviceId,
    action: action
  }, extra || {});
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).catch(err => console.log('Log Sync:', err));
}

let fishDeviceId = localStorage.getItem('fish_device_id');
if (!fishDeviceId) {
  fishDeviceId = 'fdev_' + Math.random().toString(36).slice(2, 11);
  localStorage.setItem('fish_device_id', fishDeviceId);
}

/* ============ 魚データ (2択クイズ / フリップカード設定追加) ============ */
const fishList = [
  {
    id: "aji", name: "真鯵", kana: "まあじ", img: "maaji.png",
    basicInfo: "通年出回るが、旬は初夏から夏。旨味成分が豊富で、刺身、塩焼き、フライなど万能な青魚です。",
    eatingPoint: "皮目の香ばしさと、身に感じる脂の甘みのバランスが絶妙です。生姜やネギなどの薬味と一緒に食べると、より一層旨味が引き立ちます。",
    interactive: {
      type: 'quiz',
      question: '「アジ」という名前の由来として有力な説は？',
      options: [
        { text: '「味が良い」ことから', isCorrect: true },

/* ============ 状態管理と画面遷移 ============ */
let currentFishId = null;
let surveyProfile = JSON.parse(localStorage.getItem('fish_survey')) || null;
let isMainVideoPlaying = false;

function startSeamlessLoop() {
  if (isMainVideoPlaying) return;
  isMainVideoPlaying = true;
  
  const vid1 = document.getElementById('bg-video-main-1');
  const vid2 = document.getElementById('bg-video-main-2');
  const fadeTime = 1.5;

  if (!vid1 || !vid2) return;

  vid1.currentTime = 0;
  vid1.play().catch(e => console.log('Video error:', e));
  vid1.classList.add('show-bg');

  const checkTime = (currentVid, nextVid) => {
    if (currentVid.duration > 0 && currentVid.currentTime >= currentVid.duration - fadeTime) {
      if (nextVid.paused) {
        nextVid.currentTime = 0;
        nextVid.play().catch(e => console.log('Video error:', e));
        nextVid.classList.add('show-bg');
        currentVid.classList.remove('show-bg');
      }
    }
    if (currentVid.currentTime >= currentVid.duration - 0.2) { currentVid.pause(); }
  };

  vid1.addEventListener('timeupdate', () => checkTime(vid1, vid2));
  vid2.addEventListener('timeupdate', () => checkTime(vid2, vid1));
}

function goScreen(name){
  document.querySelectorAll('.screen').forEach(el=>{
    el.classList.toggle('active', el.dataset.screen === name);
  });
  window.scrollTo({top:0, behavior:'smooth'});

  const opVideo = document.getElementById('bg-video-op');
  const header = document.getElementById('main-header');
  
  if(name === 'op') {
    if(opVideo) opVideo.classList.add('show-bg');
    if(header) header.style.display = 'none';
  } else {
    if(opVideo) opVideo.classList.remove('show-bg');
    startSeamlessLoop();
    if(header) header.style.display = 'block';
  }
}

function clearErr(groupId){
  const el = document.getElementById(groupId);
  if (el) el.classList.remove('errhi');
}

/* ============ グリッド・詳細画面の描画 ============ */
function renderFishGrid() {
  const grid = document.getElementById('fishGrid');
  if (!grid) return;
  grid.innerHTML = fishList.map(f => `
    <div class="fish-card" onclick="selectFish('${f.id}')">
      <img src="${f.img}" alt="${f.name}" onerror="this.src='https://placehold.co/200x140/transparent/FFFFFF?text=${f.name}'">
      <div class="name">${f.name}</div>
    </div>
  `).join('');
}

function selectFish(id){
  currentFishId = id;
  const f = fishList.find(x=>x.id===id);
  if (!f) return;

  document.getElementById('detailName').textContent = f.name;
  document.getElementById('detailBasic').textContent = f.basicInfo;
  document.getElementById('detailEatingPoint').textContent = f.eatingPoint;

  // インタラクティブUIの構築
  buildInteractiveUI(f);

  const finishBtn = document.getElementById('finishButton');
  if (surveyProfile) {
    finishBtn.textContent = '最初に戻る';
  } else {
    finishBtn.textContent = '最後にお聞かせください';
  }

  sendLog('魚を見た', { fishId: f.id });
  goScreen('detail');
}

/* ============ クイズ/フリップカード構築 ============ */
function buildInteractiveUI(fish) {
  const intArea = document.getElementById('interactiveArea');
  const expArea = document.getElementById('explanationArea');
  
  // 初期化
  intArea.innerHTML = '';
  expArea.style.display = 'none';
  
  const interact = fish.interactive;
  if (!interact) return;

  if (interact.type === 'quiz') {
    // 選択肢シャッフル
    const options = [...interact.options].sort(() => Math.random() - 0.5);
    const correctIndex = options.findIndex(o => o.isCorrect);

    let btnsHtml = options.map((opt, i) => {
      return `<button class="quiz-btn" onclick="answerQuiz(${opt.isCorrect}, ${i}, ${correctIndex})">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span>${opt.text}</span>
                  <span class="quiz-icon" style="font-size:12px; font-weight:bold;"></span>
                </div>
              </button>`;
    }).join('');

    intArea.innerHTML = `
      <div class="quiz-container">
        <div class="trivia-label" style="color: var(--shu-pale); margin-bottom:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          2択クイズに挑戦！
        </div>
        <div class="quiz-question">${interact.question}</div>
        <div class="quiz-options">${btnsHtml}</div>
      </div>
    `;
  } else if (interact.type === 'flip') {
    intArea.innerHTML = `
      <div class="flip-card-container" onclick="flipCard(this.querySelector('.flip-card'))">
        <div class="flip-card">
          <div class="flip-card-front">
            <div class="trivia-label" style="margin-bottom:14px; color: var(--ai-pale);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              タップして裏返す
            </div>
            <div style="font-size:16.5px; font-weight:700; line-height:1.6; font-family:var(--font-mincho);">${interact.front}</div>
          </div>
          <div class="flip-card-back">
            <div class="trivia-label" style="margin-bottom:14px; color: var(--shu-pale);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              答え
            </div>
            <div style="font-size:15px; font-weight:700; line-height:1.6;">${interact.back}</div>
          </div>
        </div>
      </div>
    `;
  }

  // 解説文とイラストのセット
  document.getElementById('detailExplanation').textContent = interact.explanation || '';
  const illWrap = document.getElementById('detailIllWrap');
  const illSvg = document.getElementById('detailIllSvg');
  const illCaption = document.getElementById('detailIllCaption');
  
  if (fish.illustration) {
    illSvg.innerHTML = fish.illustration;
    illCaption.textContent = fish.illCaption || "";
    illWrap.style.display = 'block';
  } else {
    illWrap.style.display = 'none';
    illSvg.innerHTML = "";
  }
}

/* ============ インタラクション操作時の処理 ============ */
function answerQuiz(isCorrect, selectedIdx, correctIdx) {
  const btns = document.querySelectorAll('.quiz-container .quiz-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    const iconSpan = btn.querySelector('.quiz-icon');
    if (i === correctIdx) {
      btn.classList.add('correct');
      if (iconSpan) iconSpan.textContent = '⭕️ 正解';
    } else if (i === selectedIdx && !isCorrect) {
      btn.classList.add('incorrect');
      if (iconSpan) iconSpan.textContent = '❌';
    }
  });

  // 少し遅れて解説を表示
  setTimeout(() => {
    const expArea = document.getElementById('explanationArea');
    expArea.style.display = 'block';
    expArea.style.animation = 'fadeUp 0.5s ease forwards';
  }, 400);
}

function flipCard(cardEl) {
  if(cardEl.classList.contains('flipped')) return;
  cardEl.classList.add('flipped');
  
  // 裏返った直後に解説を表示
  setTimeout(() => {
    const expArea = document.getElementById('explanationArea');
    expArea.style.display = 'block';
    expArea.style.animation = 'fadeUp 0.5s ease forwards';
  }, 500);
}

  document.getElementById('menuScreenName').textContent = f.name;

  const wrap = document.getElementById('menuScreenList');
  const items = f.menuItems && f.menuItems.length > 0 ? f.menuItems : [
    { name: `${f.name}のお造り`, description: "鮮度抜群。素材本来の味をお楽しみください。", recommendedSake: f.recommendedSake },
    { name: `${f.name}の特製なめろう`, description: "日本酒にぴったり。ちびちびとつまめる一品です。", recommendedSake: "zaku" },
    { name: `${f.name}の炭火焼き`, description: "香ばしい香りが食欲をそそります。", recommendedSake: "tateyama" }
  ];

  wrap.innerHTML = items.map(m => {
    const s = sakeList.find(sake => sake.id === m.recommendedSake);
    let sakeHtml = '';
    if (s) {
      sakeHtml = `
        <div class="pairing-sake">
          <div class="sake-group-label" style="margin-top:0;">おすすめのペアリング</div>
          <div class="sake-card" style="margin-bottom:0; background: rgba(0,0,0,0.15);">
            <span class="tag">${s.tag}</span>
            <div class="name-row">
              <span class="name">${s.name}</span>
              <span class="region">〈${s.region}〉</span>
            </div>
            <p class="taste">${s.taste}</p>
          </div>
        </div>
      `;
    }
    return `
      <div class="menu-item" onclick="this.classList.toggle('open')">
        <div class="name">
          ${m.name}
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="desc">${m.description}</div>
        ${sakeHtml}
      </div>
    `;
  }).join('');

  goScreen('menu');
}

function handleFinishClick(){
  if (surveyProfile) {
    goScreen('select');
  } else {
    goScreen('survey');
  }
}

function submitSurvey(){
  const genderEl = document.querySelector('input[name="s-gender"]:checked');
  const ageEl = document.querySelector('input[name="s-age"]:checked');
  const errorEl = document.getElementById('surveyError');

  let hasError = false;
  if (!genderEl) { document.getElementById('group-gender').classList.add('errhi'); hasError = true; }
  if (!ageEl) { document.getElementById('group-age').classList.add('errhi'); hasError = true; }

  if (hasError) {
    errorEl.style.display = 'block';
    errorEl.classList.remove('shake'); void errorEl.offsetWidth; errorEl.classList.add('shake');
    return;
  }
  errorEl.style.display = 'none';

  surveyProfile = { gender: genderEl.value, age: ageEl.value };
  localStorage.setItem('fish_survey', JSON.stringify(surveyProfile));
  sendLog('アンケート', { gender: genderEl.value, age: ageEl.value, fishId: currentFishId });
  goScreen('select');
}

renderFishGrid();
goScreen('op');

const opVid = document.getElementById('bg-video-op');
const opLogo = document.getElementById('op-logo');
if (opVid && opLogo) {
  opVid.addEventListener('ended', () => {
    opLogo.style.opacity = '1';
    setTimeout(() => {
      const opScreen = document.querySelector('[data-screen="op"]');
      if (opScreen.classList.contains('active')) { goScreen('select'); }
    }, 3000);
  });
}
