<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0809">
<title>ひとしずく — 3Dグラス 技術検証</title>
<style>
  :root{--ink:#f4ead9;--ink-dim:rgba(244,234,217,.66);--ink-faint:rgba(244,234,217,.3);--bg:#0b0809;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hint{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 22px);text-align:center;font-size:14px;letter-spacing:.1em;
    color:var(--ink-dim);text-shadow:0 1px 10px #000;pointer-events:none;transition:opacity 1s}
  .hint.off{opacity:0}
  .wines{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);width:min(100vw - 20px,460px);
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .wines button{all:unset;box-sizing:border-box;min-height:64px;padding:8px 4px 7px;border-radius:16px;cursor:pointer;text-align:center;
    border:1px solid rgba(244,234,217,.22);background:rgba(20,14,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .25s,border-color .25s}
  .wines button[aria-pressed="true"]{background:rgba(246,220,178,.16);border-color:rgba(246,220,178,.75)}
  .wines i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 -3px 5px rgba(0,0,0,.4),0 0 10px rgba(255,220,180,.2)}
  .wines span{font-size:13px;line-height:1.25;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere}
  .wines small{font-size:11px;color:var(--ink-dim);letter-spacing:.08em}
  #debug{position:fixed;left:8px;top:calc(var(--safe-t) + 8px);font:12px/1.4 ui-monospace,Menlo,monospace;color:#bfe7c0;
    background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;pointer-events:none;z-index:5}
  /* WebGL が使えない端末:図で代用 */
  #fallback{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);height:62vh;pointer-events:none}
  .nogl #fallback{display:block} .nogl #gl{display:none} .nogl .hint{display:none}
  .nogl body{background:radial-gradient(60% 45% at 28% 18%,rgba(255,170,90,.22),transparent 70%),linear-gradient(180deg,#0b0809 62%,#1a100b 62.2%,#0d0807)}
</style>
</head>

  <ellipse cx="0" cy="-130" rx="37" ry="4.5" fill="none" stroke="rgba(255,240,220,.7)" stroke-width="1"/>
  <path d="M-3 0V118M3 0V118" stroke="rgba(255,240,220,.45)" stroke-width="1"/>
  <ellipse cx="0" cy="126" rx="42" ry="6" fill="rgba(255,255,255,.05)" stroke="rgba(255,240,220,.55)" stroke-width="1"/>
