<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハッピーリングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* -------------------------------------
           全体設定
        ------------------------------------- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* -------------------------------------
           背景設定
        ------------------------------------- */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            /* 背景の切り替わり速度を2.5秒に変更（キャラクター到着と完全に一致させる） */
            transition: opacity 2.5s ease-in-out;
            z-index: 1;
        }

        .background-layer.active {
            opacity: 1;
        }

        /* 最後の画面への遷移用スローモーション */
        .background-layer.slow-transition {
            transition: opacity 3s ease-in-out !important;
        }

        /* スタートから1問目への遷移用スローモーション */
        .background-layer.very-slow-transition {
            transition: opacity 6s ease-in-out !important;
        }

        /* -------------------------------------
           白オーバーレイの追加
        ------------------------------------- */
        .white-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4); /* 初期状態（スタート画面）は40%に変更 */
            z-index: 2;
            pointer-events: none;
            transition: background-color 1.5s; /* クイズ画面への遷移に合わせてフェードアウト */
        }

        .white-overlay.hidden {
            background-color: rgba(255, 255, 255, 0); /* 非表示状態 */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: 3;
            pointer-events: none;
            transition: background 1s ease;
        }

        /* 4問目用の中心をくり抜いたオーバーレイ */
        .overlay.hole {
            /* 中心にうっすら黒(20%)を乗せて色を濃く見せ、外側は白(30%)にする */
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.15) 25%, rgba(255,255,255,0.3) 45%, rgba(255,255,255,0.3) 100%);
        }

        /* -------------------------------------
           スタート画面・クリア画面
        ------------------------------------- */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 全体を中央寄せベースに */
            align-items: center;
            pointer-events: none;
            padding-top: 0; 
        }

        /* -------------------------------------
           タイトルデザイン
        ------------------------------------- */
        .title-container {
            text-align: center;
            z-index: 200;
            pointer-events: none;
            position: absolute; 
            top: 8%; /* 画面上部から8%の位置 */
            width: 90%;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 1s, transform 1s;
        }

        .title-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* タイトル画像のアニメーション（画面左側からバウンド） */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateX(-100vw) translateY(-150px) rotate(-20deg);
            }
            35% {
                opacity: 1;
                /* 1回目の着地：ドスンと潰れる */
                transform: translateX(-20px) translateY(30px) scale(1.15, 0.8) rotate(5deg);
            }
            60% {
                /* ボヨーンと大きく上に跳ね返る（伸びる） */
                transform: translateX(10px) translateY(-50px) scale(0.9, 1.1) rotate(-5deg);
            }
            80% {
                /* 2回目の着地：軽く潰れる */
                transform: translateX(-5px) translateY(10px) scale(1.05, 0.95) rotate(2deg);
            }
            90% {
                /* 最後に小さく跳ねる */
                transform: translateX(2px) translateY(-5px) scale(0.98, 1.02) rotate(-1deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) translateY(0) scale(1) rotate(0deg);
            }
        }

        /* ロゴのふわふわアニメーション */
        @keyframes floatLogo {
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
            50% { transform: scale(1) translateY(-10px) rotate(0deg); }
        }

        .title-word {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
        }

        .title-container.show .title-word-1 {
            /* 飛び出すアニメーション(popIn)が完了した直後に、ふわふわアニメーション(floatLogo)に切り替えてループ */
            animation-name: popIn, floatLogo;
            animation-duration: 1.2s, 3s;
            animation-timing-function: ease-out, ease-in-out;
            animation-delay: 0s, 1.2s;
            animation-fill-mode: forwards, forwards;
            animation-iteration-count: 1, infinite;
        }

        /* スタートボタンのふわふわアニメーション */
        @keyframes floatBtn {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(calc(-50% - 8px)); }
        }

        .start-btn {
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.8s ease;
            font-size: 1.5rem;
            padding: 15px 50px;
            margin-bottom: 0; 
            position: absolute; 
            top: 62%; 
            transform: translateY(-50%); 
            will-change: transform;
        }
        
        .start-btn.show {
            opacity: 1;
            /* 透明からフェードインし終わる頃にふわふわを開始 */
            animation: floatBtn 2.5s ease-in-out 0.8s infinite;
        }

        /* ふわふわ中のスタートボタンを押した時のへこみアニメーション調整 */
        .start-btn:active {
            transform: translateY(-50%) scale(0.95) !important;
            animation-play-state: paused;
        }

        #completion-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            /* 背景の変化に合わせて、文章もゆっくり2.5秒かけて表示させる */
            transition: opacity 2.5s ease-in-out;
            padding: 10px;
        }

        #completion-screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* -------------------------------------
           クイズUI・モーダル
        ------------------------------------- */
        #quiz-ui-container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 20px 20px;
            max-height: 60vh; 
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #quiz-ui-container.active {
            opacity: 1;
            visibility: visible;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .choice-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s, border-color 0.2s;
            cursor: pointer;
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .next-btn {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
            color: #d13b53;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* -------------------------------------
           キャラクター設定
        ------------------------------------- */
        #character-container {
            position: absolute;
            bottom: 2%; 
            left: 50%;
            z-index: 5;
            display: grid;
            place-items: end center;
            pointer-events: none;
            will-change: transform;
            transform: translateX(-50%) translateX(-400px); 
        }

        /* 2つの画像に共通の設定 */
        #character-img-static, 
        #character-img-walk {
            grid-area: 1 / 1; 
            height: 180px; 
            width: auto;
            object-fit: contain;
            border: none;
            outline: none;
            background-color: transparent;
            transform-origin: bottom center;
        }

        /* 止まっている時の画像 */
        #character-img-static {
            transform: scale(1.02); 
            display: block; 
        }

        /* 歩いている時の画像 */
        #character-img-walk {
            transform: scale(1.22) translateY(30px);  
            display: none; 
        }
    </style>
</head>
<!-- iOS Safariでボタンのへこみ(:active)を機能させるための魔法の1行 ontouchstart="" -->
<body ontouchstart="">

<div id="app-container">
    <div id="start-screen">
        <div id="start-title-container" class="title-container" style="display: none;">
            <!-- ロゴ画像 -->
            <div class="text-center w-full">
                <span class="title-word title-word-1" style="display: inline-block; width: 85%; max-width: 320px;">
                    <img id="main-logo" src="rogo3.png" alt="ハッピーリングクイズ" style="width: 100%; height: auto; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); background: transparent;">
                </span>
            </div>
        </div>
        <button class="next-btn start-btn" id="start-btn-element" style="display: none;" onclick="startQuiz()">スタート</button>
    </div>

    <!-- 背景画像 -->
    <div id="bg-0" class="background-layer active" style="background-image: url('start.jpg');"></div>
    <div id="bg-1" class="background-layer" style="background-image: url('quiz1.jpg');"></div>
    <div id="bg-2" class="background-layer" style="background-image: url('quiz2.jpg');"></div>
    <div id="bg-3" class="background-layer" style="background-image: url('quiz3.jpg');"></div>
    <div id="bg-4" class="background-layer" style="background-image: url('quiz4.jpg');"></div>
    <div id="bg-5" class="background-layer" style="background-image: url('quiz5.jpg');"></div>
    <div id="bg-6" class="background-layer" style="background-image: url('result.jpg');"></div>
    
    <!-- オーバーレイ -->
    <div class="white-overlay"></div>
    <div class="overlay"></div>

    <!-- クイズUI領域 -->
    <div id="quiz-ui-container">
        <div class="glass-panel text-center w-full max-w-sm mb-6">
            <h2 id="question-number" class="text-2xl font-bold text-gray-800 mb-3"></h2>
            <p id="question-text" class="text-gray-800 text-xl font-bold leading-relaxed"></p>
        </div>
        <div class="flex gap-4 w-full max-w-sm">
            <button class="choice-btn text-5xl text-blue-500 font-bold" onclick="answer('〇')">〇</button>
            <button class="choice-btn text-5xl text-red-500 font-bold" onclick="answer('✖')">✖</button>
        </div>
    </div>

    <!-- キャラクター -->
    <div id="character-container">
        <img id="character-img-static" src="maru.png" alt="">
        <img id="character-img-walk" src="maruwaalk5.webp" alt="">
    </div>

    <!-- Safariのアニメーション停止バグを防ぐためのキープアライブ（常時表示・非可視） -->
    <img src="maruwaalk5.webp" style="position: absolute; top: 50%; left: 50%; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1;" alt="">

    <!-- 結果モーダル -->
    <div id="result-modal" class="modal">
        <div class="modal-content glass-panel w-full max-w-md text-center">
            <h2 id="modal-title" class="text-3xl font-bold mb-5"></h2>
            <p id="modal-desc" class="text-gray-700 text-left text-xl font-bold mb-8 leading-relaxed"></p>
            <button class="next-btn text-xl" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>

    <!-- クリア画面 -->
    <div id="completion-screen">
        <!-- 背景の白さを25%から80%に上げて透けすぎないように調整 -->
        <div class="glass-panel text-center w-full max-w-md px-3 sm:px-6" style="background: rgba(255, 255, 255, 0.8); backdrop-filter: none; border: 1px solid rgba(255,255,255,0.9);">
            <h2 class="text-4xl font-bold text-red-600 mb-6" style="text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 0px 4px 5px rgba(255,255,255,1);">クリア！</h2>
            <!-- 文字サイズをスマホ幅に合わせて調整し、特定の文章が折り返さないように設定 -->
            <div class="inline-block text-left">
                <p class="text-gray-900 text-[19px] sm:text-2xl mb-4 font-bold leading-relaxed" style="text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff, 0px 2px 4px rgba(255,255,255,1);">
                    <span class="whitespace-nowrap">ご参加ありがとうございます！</span><br><br>
                    この後もいつも通り美味しく<br>
                    生ビールを飲んで楽しんでください！<br><br>
                    あなたの「美味しい！」が、<br>
                    子どもたちの笑顔につながります。<br><br>
                    <span class="whitespace-nowrap">さぁ、今日も楽しくカンパイしましょう！</span>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            qNum: 1,
            question: "参加店舗で「生ビール」が1リットル提供されるごとに、1円が<span class=\"whitespace-nowrap\">寄付</span>される。",
            answer: "〇",
            explanation: "正解は〇！キャンペーン期間中、参加店で生ビールが1リットル注文されるごとに、1円が寄付金になります。"
        },
        {
            qNum: 2,
            question: "集まった寄付金は、子ども食堂や子どもの問題解決に取り組む団体に寄付される。",
            answer: "〇",
            explanation: "正解は〇！「カンパイでつなぐ 子どもたちの笑顔の輪」を目指して、子ども食堂などの支援に役立てられます。"
        },
        {
            qNum: 3,
            question: "お客様がこのチャリティに参加するには、生ビール1杯につき追加で1円のお金を払う必要がある。",
            answer: "✖",
            explanation: "正解は✖！寄付金の1円はマルト水谷より寄付されるため、お客様が追加でお金を払う必要はありません。お店でいつも通り美味しく楽しく生ビールを飲むだけで社会貢献につながる仕組みです！"
        },
        {
            qNum: 4,
            question: "子ども食堂は、食事を提供するだけで「勉強」や「交流」をする<span class=\"whitespace-nowrap\">場所</span>ではない。",
            answer: "✖",
            explanation: "正解は✖！子ども食堂は食事だけでなく、学習支援や絵本の読み聞かせ、地域の人との交流や体験の場としても活動しています。"
        },
        {
            qNum: 5,
            question: "このチャリティ活動は、国連が定める「SDGs（持続可能な開発目標）」の取り組みにもつながっている。",
            answer: "〇",
            explanation: "正解は〇！「貧困をなくそう」「飢餓をゼロに」など、SDGsの目標達成にもつながる取り組みです。"
        }
    ];

    let currentQuestionIndex = 0;

    const questionNumberEl = document.getElementById('question-number');
    const questionTextEl = document.getElementById('question-text');
    const characterContainer = document.getElementById('character-container');
    const resultModal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const completionScreen = document.getElementById('completion-screen');
    const quizUiContainer = document.getElementById('quiz-ui-container');

    // ==========================================
    // アニメーション切り替え
    // ==========================================
    function setWalking(isWalk) {
        const staticImg = document.getElementById('character-img-static');
        const walkImg = document.getElementById('character-img-walk');

        if (isWalk) {
            staticImg.style.display = 'none';
            walkImg.style.display = 'block';
        } else {
            staticImg.style.display = 'block';
            walkImg.style.display = 'none';
        }
    }

    // ==========================================
    // 初期ロード時のアニメーション
    // ==========================================
    async function initQuiz() {
        characterContainer.style.display = "grid"; 
        characterContainer.style.transition = 'none';
        characterContainer.style.transform = 'translateX(-50%) translateX(-400px)';

        await new Promise(resolve => setTimeout(resolve, 50));

        setWalking(true);

        characterContainer.style.transition = 'transform 3s linear';
        characterContainer.style.transform = 'translateX(-50%) translateX(0px)';

        setTimeout(() => {
            setWalking(false); 
            const startBtn = document.getElementById('start-btn-element');
            const startTitle = document.getElementById('start-title-container');
            
            // 1. タイトル表示
            startTitle.style.display = 'block';
            setTimeout(() => {
                startTitle.classList.add('show');
            }, 50); 
            
            // 2. スタートボタン表示
            setTimeout(() => {
                startBtn.style.display = 'block';
                setTimeout(() => {
                    startBtn.classList.add('show');
                }, 50);
            }, 1200);

        }, 3000);
    }

    // ==========================================
    // ステージ遷移のアニメーション
    // ==========================================
    async function transitionToNextStage(nextIndex) {
        const currentActiveBg = document.querySelector('.background-layer.active');
        const nextBg = (nextIndex < quizData.length) ? document.getElementById(`bg-${nextIndex + 1}`) : null;

        const isNextQuestion4 = (nextIndex === 3);
        const isLeavingQuestion4 = (currentQuestionIndex === 3);
        const isFinished = (nextIndex >= quizData.length);
        const isStartTransition = (nextIndex === 0);

        // 4問目の時だけオーバーレイの中心をくり抜く（スポットライト効果）
        const overlayLayer = document.querySelector('.overlay');
        if (isNextQuestion4) {
            overlayLayer.classList.add('hole');
        } else {
            overlayLayer.classList.remove('hole');
        }

        // --- 背景切り替え（キャラクター退場と同時に変化を始めるようにタイミングを前倒し） ---
        if (nextBg && nextBg !== currentActiveBg) {
            if (isStartTransition) {
                // スタート時は退場3秒＋登場3秒に合わせて、6秒かけて背景を切り替える
                if (currentActiveBg) currentActiveBg.classList.add('very-slow-transition');
                nextBg.classList.add('very-slow-transition');
            }
            nextBg.classList.add('active');
        } else if (isFinished) {
            const resultBg = document.getElementById('bg-6');
            if (resultBg && resultBg !== currentActiveBg) {
                // 最後の画面だけ3秒かけてゆっくり切り替わるようにクラスを付与
                if (currentActiveBg) currentActiveBg.classList.add('slow-transition');
                resultBg.classList.add('slow-transition');
                resultBg.classList.add('active');
            }
        }

        // --- 1. 退場アニメーション ---
        // 最終問題（5問目）クリア時にも退場アニメーションを実行させるために分岐を統合
        if (!isLeavingQuestion4) {
            setWalking(true);
            await new Promise(resolve => setTimeout(resolve, 50));
            
            if (isFinished) {
                // 最終問題クリア時は、エンディングに合わせて3秒かけてゆっくり歩く
                characterContainer.style.transition = 'transform 3.0s linear';
                characterContainer.style.transform = 'translateX(-50%) translateX(400px)';
                await new Promise(resolve => setTimeout(resolve, 3000));
            } else if (isStartTransition) {
                // スタート画面からの退場は、入場時と同じく3秒かけて歩く
                characterContainer.style.transition = 'transform 3.0s linear';
                characterContainer.style.transform = 'translateX(-50%) translateX(400px)';
                await new Promise(resolve => setTimeout(resolve, 3000));
            } else {
                // 通常は1.25秒で退場（登場の1.25秒と合わせてトータル2.5秒）
                characterContainer.style.transition = 'transform 1.25s linear';
                characterContainer.style.transform = 'translateX(-50%) translateX(400px)';
                await new Promise(resolve => setTimeout(resolve, 1250));
            }
        } else {
            await new Promise(resolve => setTimeout(resolve, 1250));
        }

        // --- 2. 登場アニメーション ---
        if (!isFinished) {
            if (!isNextQuestion4) {
                characterContainer.style.display = "grid";
                characterContainer.style.transition = 'none';
                characterContainer.style.transform = 'translateX(-50%) translateX(-400px)';

                await new Promise(resolve => setTimeout(resolve, 50));

                setWalking(true);

                if (isStartTransition) {
                    // 1問目への登場も、入場時と同じく3秒かけて歩く
                    characterContainer.style.transition = 'transform 3.0s linear';
                    characterContainer.style.transform = 'translateX(-50%) translateX(0px)';
                    await new Promise(resolve => setTimeout(resolve, 3000));
                } else {
                    // 通常は1.25秒で登場
                    characterContainer.style.transition = 'transform 1.25s linear';
                    characterContainer.style.transform = 'translateX(-50%) translateX(0px)';
                    await new Promise(resolve => setTimeout(resolve, 1250));
                }
            } else {
                characterContainer.style.display = "none";
                await new Promise(resolve => setTimeout(resolve, 1250));
            }
        }

        // --- 3. UIの表示と待機 ---
        if (currentActiveBg && currentActiveBg !== nextBg && nextBg !== null) {
            currentActiveBg.classList.remove('active');
            
            // スタート時のスローモーションクラスを次回以降に影響しないよう解除
            if (isStartTransition) {
                setTimeout(() => {
                    if(currentActiveBg) currentActiveBg.classList.remove('very-slow-transition');
                    if(nextBg) nextBg.classList.remove('very-slow-transition');
                }, 6000);
            }
        } else if (isFinished && currentActiveBg) {
             currentActiveBg.classList.remove('active');
        }
        
        // ここから下が確実に実行されることでクイズが開始します
        setWalking(false); 
        
        if (isFinished) {
            characterContainer.style.display = "none"; 
            completionScreen.classList.add('active');
        } else {
            currentQuestionIndex = nextIndex;
            loadQuestion(currentQuestionIndex);
            quizUiContainer.classList.add('active');
        }
    }

    // ==========================================
    // UI操作関数
    // ==========================================
    function startQuiz() {
        const startBtn = document.getElementById('start-btn-element');
        startBtn.classList.remove('show');
        
        // タイトルもフェードアウトさせる（より美しい演出のため）
        const startTitle = document.getElementById('start-title-container');
        if(startTitle) startTitle.classList.remove('show');

        setTimeout(() => {
            document.getElementById('start-screen').style.display = 'none';
            // スタート画面が消えたら、白オーバーレイも非表示にする
            const whiteOverlay = document.querySelector('.white-overlay');
            whiteOverlay.classList.add('hidden');
        }, 500);

        transitionToNextStage(0);
    }

    function loadQuestion(index) {
        const q = quizData[index];
        questionNumberEl.textContent = `第${q.qNum}問`;
        questionTextEl.innerHTML = q.question;

        if (index === 3) {
            characterContainer.style.display = "none";
        } else {
            characterContainer.style.transition = 'none';
            characterContainer.style.display = "grid"; 
            characterContainer.style.transform = 'translateX(-50%) translateX(0px)';
            setWalking(false);
        }
    }

    function answer(userChoice) {
        const q = quizData[currentQuestionIndex];
        const isCorrect = (userChoice === q.answer);

        quizUiContainer.classList.remove('active');

        if (isCorrect) {
            modalTitle.textContent = "正解！";
            modalTitle.style.color = "#ef4444"; 
        } else {
            modalTitle.textContent = "残念...";
            modalTitle.style.color = "#3b82f6"; 
        }
        modalDesc.textContent = q.explanation;
        
        setTimeout(() => {
            resultModal.classList.add('active');
        }, 500); 
    }

    function nextQuestion() {
        resultModal.classList.remove('active');
        transitionToNextStage(currentQuestionIndex + 1);
    }

    window.onload = initQuiz;

</script>
</body>
</html>
