<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>居酒屋メニュー性格診断</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-sub: #6c757d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e9ecef;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    p.desc { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 24px; }

    /* ボタン共通 */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #f1f3f5;
      color: var(--text-main);
    }
    .btn-secondary:hover { background: #e9ecef; }

    /* 質問画面 */
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    /* 結果画面 */
    .result-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--primary);
      background: #eff6ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .menu-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .menu-catch {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. トップ画面 -->
  <div id="screen-top" class="card">
    <h1>居酒屋メニュー性格診断</h1>
    <p class="desc">全5問・約1分で完了！<br>あなたを居酒屋のメニューに例えると？</p>
    <button class="btn" onclick="startDiagnosis()">診断をはじめる</button>
  </div>

  <!-- 2. 質問画面 -->
  <div id="screen-quiz" class="card hidden">
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>
    <h2 id="question-text" style="font-size: 1.1rem; margin-bottom: 20px;"></h2>
    <div id="options-container"></div>
  </div>

  <!-- 3. 個人の結果画面 -->
  <div id="screen-result" class="card hidden">
    <span class="result-badge">診断結果</span>
    <div id="result-type" class="menu-title">出汁巻き玉子</div>
    <div id="result-catch" class="menu-catch">～妥協を許さない職人肌～</div>
    
    <p id="result-desc" style="font-size: 0.9rem; line-height: 1.6; text-align: left; margin-bottom: 20px; color: #495057;">
      一見落ち着いて見えますが、内面は仕事が丁寧で一切の手抜きを許さないタイプ。確かな仕事で周りからの信頼は抜群です。
    </p>

    <div class="divider"></div>

    <!-- ここからグループ診断への導線 -->
    <p class="desc" style="margin-bottom: 12px; font-weight: 600; color: var(--text-main);">
      ＼ テーブルのみんなでまとめよう ／
    </p>
    <button class="btn" onclick="goToGroup()">今日のグループ診断を作成</button>
    <button class="btn btn-secondary" onclick="resetQuiz()">もう一度診断する</button>
  </div>
</div>

<script>
  let questions = [];
  let results = {};
  let currentQ = 0;
  let scores = {};

  // 画面読み込み時に JSON データを取得する
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const response = await fetch('data.json');
      const data = await response.json();
      
      questions = data.questions;
      results = data.results;

      // スコア保持用オブジェクトの初期化
      Object.keys(results).forEach(key => {
        scores[key] = 0;
      });

    } catch (error) {
      console.error("JSONの読み込みに失敗しました:", error);
      alert("データの読み込みに失敗しました。ページを再読み込みしてください。");
    }
  });

  function startDiagnosis() {
    if (questions.length === 0) {
      alert("データを読み込み中です。少々お待ちください。");
      return;
    }
    document.getElementById('screen-top').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const q = questions[currentQ];
    document.getElementById('question-text').innerText = q.q;
    
    // 進捗バーの更新
    const progress = (currentQ / questions.length) * 100;
    document.getElementById('progress').style.width = `${progress}%`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(opt.type);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(type) {
    if (scores[type] !== undefined) {
      scores[type]++;
    }
    currentQ++;

    if (currentQ < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    // 最高スコアのタイプを判定
    const finalType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
    const res = results[finalType];

    document.getElementById('result-type').innerText = res.title;
    document.getElementById('result-catch').innerText = res.catch;
    document.getElementById('result-desc').innerText = res.desc;
  }

  function resetQuiz() {
    currentQ = 0;
    Object.keys(scores).forEach(key => scores[key] = 0);
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-top').classList.remove('hidden');
  }

  function goToGroup() {
    alert("グループ診断画面へ遷移する処理をここに実装します");
  }

  function getFinalResult(scores) {
    // 1. 最高スコア（数値）を取得
    const maxScore = Math.max(...Object.values(scores));

    // 2. 最高スコアと同じ値を持つタイプ（キー）をすべて抽出
    const topTypes = Object.keys(scores).filter(key => scores[key] === maxScore);

    // 3. 同点の中からランダムで1つ選んで返す
    const randomIndex = Math.floor(Math.random() * topTypes.length);
    return topTypes[randomIndex];
  }

</script>

</body>
</html>
