<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おさかな シルエット クイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Stick&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Stick', sans-serif;
            /* 背景の素材を入れる場合は、ここの background-image などを変更してください */
            background-color: #fdf6e3; 
            color: #4a3b32;
            word-break: keep-all; /* 単語の途中で改行されないようにする */
            overflow-wrap: break-word; /* 画面幅を超える長い単語は改行を許可 */
        }

        /* カクカクの枠（直線でザクザク切ったような形） */
        .kirie-box {
            background-color: rgba(255, 255, 255, 0.85);
            clip-path: polygon(
                2% 3%, 30% 1%, 75% 2%, 98% 4%, 
                99% 30%, 97% 75%, 96% 97%, 
                70% 99%, 25% 97%, 4% 96%, 
                1% 70%, 2% 25%
            );
            filter: drop-shadow(6px 6px 0px rgba(74, 59, 50, 0.4));
            transform: rotate(-1deg);
        }

        /* カクカクのボタン */
        .kirie-btn {
            clip-path: polygon(
                3% 4%, 25% 1%, 80% 3%, 97% 5%, 
                99% 50%, 96% 96%, 75% 98%, 
                20% 96%, 4% 97%, 1% 50%
            );
            filter: drop-shadow(4px 4px 0px rgba(74, 59, 50, 0.4));
            transition: all 0.2s ease;
            position: relative;
        }
        
        /* ボタンを交互に少しだけ違う形・傾きにする */
        .kirie-btn:nth-child(odd) { 
            clip-path: polygon( 1% 5%, 40% 1%, 98% 3%, 96% 50%, 99% 95%, 60% 98%, 3% 97%, 4% 50% );
            transform: rotate(1deg); 
        }
        .kirie-btn:nth-child(even) { 
            clip-path: polygon( 4% 2%, 70% 3%, 96% 1%, 98% 60%, 95% 98%, 30% 96%, 1% 95%, 2% 40% );
            transform: rotate(-1deg); 
        }
        
        .kirie-btn:active {
            transform: translate(4px, 4px) rotate(0deg) !important;
            filter: drop-shadow(0px 0px 0px rgba(74, 59, 50, 0.4)) !important;
        }

        .kirie-title {
            display: inline-block;
            transform: rotate(-2deg);
        }

        /* バッジ（もんだい ばんごう など） */
        .kirie-badge {
            clip-path: polygon( 4% 3%, 96% 5%, 98% 95%, 5% 96% );
            filter: drop-shadow(3px 3px 0px rgba(74, 59, 50, 0.3));
            transform: rotate(2deg);
        }

        /* 画像をいれる枠（カクカクに切り抜いた窓） */
        .kirie-img-box {
            background-color: #fdf6e3;
            clip-path: polygon( 2% 3%, 97% 2%, 96% 97%, 3% 96% );
            filter: drop-shadow(4px 4px 0px rgba(74, 59, 50, 0.15));
        }

        .btn-orange { background-color: #ffb07c; }
        .btn-blue { background-color: #93c5fd; }
        .btn-green { background-color: #86efac; }
        .btn-pink { background-color: #f9a8d4; }
        .btn-yellow { background-color: #fde047; }

        /* シルエット化するためのクラス（真っ黒にする） */
        .silhouette {
            filter: brightness(0);
            transition: filter 0.3s ease;
        }

        /* ヒント状態のクラス（うっすら見える） */
        .hint-mode {
            filter: brightness(0.3) grayscale(0.5);
            transition: filter 0.3s ease;
        }

        /* 画像がふわっと切り替わるアニメーション */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* シルエットがゆったりぷかぷか泳いで登場するアニメーション */
        .swim-in {
            animation: swimIn 2.5s ease-in-out forwards;
        }
        @keyframes swimIn {
            0% { opacity: 0; transform: translateX(60px) translateY(10px) rotate(-3deg); }
            50% { opacity: 0.8; transform: translateX(20px) translateY(-5px) rotate(2deg); }
            100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0deg); }
        }

        /* 水槽のおさかながフワフワするアニメーション */
        .float-anim {
            animation: floatAnim 3s ease-in-out infinite alternate;
        }
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-10px) rotate(2deg); }
        }

        /* 結果画像のタップアニメーション */
        @keyframes animSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes animFlip {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        @keyframes animShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-3deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(3deg); }
        }
        .anim-spin { animation: animSpin 0.6s ease; }
        .anim-flip { animation: animFlip 0.6s ease; }
        .anim-shake { animation: animShake 0.6s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ==============================================
         はいけい どうが（クロスフェードで しぜんに ループ）
    =============================================== -->
    <div class="fixed inset-0 w-full h-full -z-10">
        <!-- 1つめの どうが -->
        <video id="bg-video-1" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000" style="opacity: 1;" src="marubatsu_back.mp4" autoplay muted playsinline></video>
        <!-- 2つめの どうが（うしろに かくしておく） -->
        <video id="bg-video-2" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000" style="opacity: 0;" src="marubatsu_back.mp4" muted playsinline></video>
    </div>

    <div id="app-container" class="w-full max-w-md mx-auto relative overflow-hidden">
        
        <!-- ==============================================
             スタート がめん
        =============================================== -->
        <div id="screen-start" class="kirie-box p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <h1 class="text-4xl font-bold mb-8 leading-snug kirie-title">
                おさかな<br>シルエット<br>クイズ
            </h1>
            <button onclick="startGame()" class="kirie-btn btn-orange text-2xl font-bold py-4 px-10 kirie-text">
                スタート！
            </button>
        </div>

        <!-- ==============================================
             クイズ がめん
        =============================================== -->
        <div id="screen-quiz" class="hidden">
            <div class="kirie-box p-6 flex flex-col items-center min-h-[500px]">
                
                <!-- 修正: ここに問題番号を表示する要素を追加しました -->
                <h2 id="question-number" class="text-2xl font-bold mb-4 btn-yellow inline-block px-6 py-2 kirie-badge">1 もんめ</h2>
                
                <p class="mb-4 font-bold text-lg">これは なんの おさかな かな？</p>

                <!-- 画像素材を入れるエリア -->
                <div class="w-48 h-48 mb-4 relative flex justify-center items-center kirie-img-box p-2">
                    <img id="fish-image" src="" alt="おさかな" class="max-w-full max-h-full object-contain">
                </div>

                <!-- ひんと ボタン -->
                <button onclick="showHint()" id="hint-btn" class="kirie-btn btn-green text-lg font-bold py-2 px-8 mb-6">
                    ひんと
                </button>

                <!-- せんたくし ボタン エリア -->
                <div id="options-container" class="w-full flex flex-col gap-6">
                    <!-- ボタンは JavaScript で つくられます -->
                </div>

            </div>
        </div>

        <!-- ==============================================
             けっか（せいかい・ざんねん）の ポップアップ
        =============================================== -->
        <div id="popup-result" class="hidden absolute top-0 left-0 w-full h-full bg-black/40 flex items-center justify-center p-4 z-50">
            <div class="kirie-box p-8 text-center bg-white w-full max-w-sm fade-in flex flex-col items-center">
                <h2 id="popup-title" class="text-4xl font-bold mb-4 text-red-500 kirie-title">せいかい！</h2>
                
                <!-- 結果ポップアップ用の画像表示エリアを追加 -->
                <div class="w-40 h-40 mb-4 relative flex justify-center items-center kirie-img-box p-2">
                    <img id="result-image" src="" alt="こたえの おさかな" class="max-w-full max-h-full object-contain cursor-pointer" onclick="playResultAnimation()">
                </div>

                <p id="popup-text" class="text-xl mb-6 font-bold">こたえは「まぐろ」です</p>
                
                <!-- まめちしき -->
                <p id="popup-trivia" class="text-base mb-6 font-bold text-gray-700 bg-yellow-100 p-3 rounded-lg kirie-box w-full"></p>
                
                <button onclick="nextQuestion()" class="kirie-btn btn-blue text-xl font-bold py-3 px-8 w-full">
                    つぎの もんだい へ
                </button>
            </div>
        </div>

        <!-- ==============================================
             おわり の がめん
        =============================================== -->
        <div id="screen-end" class="hidden kirie-box p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
            <h2 class="text-4xl font-bold mb-6 kirie-title">おしまい！</h2>
            <div class="mb-8">
                <p class="text-xl font-bold mb-4 kirie-text">きみの せいかい かず は...</p>
                <p id="final-score" class="text-4xl font-bold btn-yellow inline-block px-8 py-4 kirie-badge kirie-text">
                    5 もん
                </p>
            </div>
            
            <button onclick="showAquarium()" class="kirie-btn btn-blue text-xl font-bold py-4 px-10 mb-4 w-full">
                すいそう を みる！
            </button>
            <button onclick="resetGame()" class="kirie-btn btn-green text-xl font-bold py-4 px-10 w-full">
                もういちど あそぶ
            </button>
        </div>

        <!-- ==============================================
             おさかな すいそう がめん
        =============================================== -->
        <div id="screen-aquarium" class="hidden kirie-box p-6 flex flex-col items-center justify-center min-h-[500px] w-full">
            <h2 class="text-2xl font-bold mb-4 kirie-badge btn-blue px-6 py-2">きみの すいそう</h2>
            
            <div class="w-full h-[300px] relative overflow-hidden bg-cyan-100/60 mb-6 kirie-img-box">
                <div id="aquarium-fish-area" class="w-full h-full relative"></div>
            </div>
            
            <button onclick="resetGame()" class="kirie-btn btn-green text-xl font-bold py-4 px-10 w-full">
                もういちど あそぶ
            </button>
        </div>

    </div>

    <script>
        // ==========================================
        // ★ クイズの せってい（ここを かえられます）
        // ==========================================
        
        // あとから ランダムに したいときは、ここを true に します。
        // （いまは テストしやすいように false に しています）
        const isRandomMode = true; 

        // しゅつだい する かず（ほんばんは 5 にします）
        const maxQuestions = 5;


        // ==========================================
        // ★ おさかな の データ（8パターン）
        // ==========================================
        
        const allFishData = [
            {
                name: "まぐろ",
                img: "maguro.webp",
                options: ["まぐろ", "じんべえざめ", "まんぼう"],
                trivia: "まぐろ は とっても はやく およぐよ！"
            },
            {
                name: "じんべえざめ",
                img: "zinnbe.webp",
                options: ["くじら", "じんべえざめ", "えい"],
                trivia: "せかいで いちばん おおきい おさかな だよ！"
            },
            {
                name: "まんぼう",
                img: "manbo.webp",
                options: ["えい", "たつのおとしご", "まんぼう"],
                trivia: "とっても おおきくて のんびりやさん だよ！"
            },
            {
                name: "えい",
                img: "ei.webp",
                options: ["えい", "ひらめ", "とびうお"],
                trivia: "うみの そこを ひらひら とぶように およぐよ！"
            },
            {
                name: "ひらめ",
                img: "hirame.webp",
                options: ["まぐろ", "ひらめ", "ちょうちんあんこう"],
                trivia: "すな に かくれて かくれんぼ が じょうず！"
            },
            {
                name: "たつのおとしご",
                img: "tatsuoto.webp",
                options: ["たつのおとしご", "えい", "とびうお"],
                trivia: "くるくる の しっぽ で くさ を つかむんだよ！"
            },
            {
                name: "とびうお",
                img: "tobiuo.webp",
                options: ["じんべえざめ", "とびうお", "まんぼう"],
                trivia: "むなびれ を ひろげて そら を とぶよ！"
            },
            {
                name: "ちょうちんあんこう",
                img: "ankoo.webp",
                options: ["ちょうちんあんこう", "まぐろ", "ひらめ"],
                trivia: "あたま の ひかり で えもの を よぶよ！"
            }
        ];

        let currentQuestions = []; // 今回 出題する 問題のリスト
        let currentIndex = 0;      // いま 何問目か（0からスタート）
        let score = 0;             // せいかい した かず
        let correctFishes = [];    // せいかい した おさかな を いれる はこ

        // 画面の 要素（ようそ）を 取得（しゅとく）
        const screenStart = document.getElementById("screen-start");
        const screenQuiz = document.getElementById("screen-quiz");
        const screenEnd = document.getElementById("screen-end");
        const popupResult = document.getElementById("popup-result");
        
        const questionNumberText = document.getElementById("question-number");
        const fishImage = document.getElementById("fish-image");
        const optionsContainer = document.getElementById("options-container");
        const popupTitle = document.getElementById("popup-title");
        const popupText = document.getElementById("popup-text");
        const popupTrivia = document.getElementById("popup-trivia"); // まめちしき よう
        const finalScoreText = document.getElementById("final-score");
        const resultImage = document.getElementById("result-image");
        const screenAquarium = document.getElementById("screen-aquarium"); // すいそう がめん
        const aquariumFishArea = document.getElementById("aquarium-fish-area"); // すいそう の なか

        // ボタンの 色（いろ）リスト（ランダムで わけるため）
        const btnColors = ["btn-orange", "btn-blue", "btn-pink"];

        // ==========================================
        // ゲーム スタート
        // ==========================================
        function startGame() {
            score = 0;
            currentIndex = 0;
            correctFishes = []; // すいそう を からっぽ に する

            // 問題を じゅんび する
            if (isRandomMode) {
                // ランダム の ばあい（シャッフルして 5個 えらぶ）
                let shuffled = [...allFishData].sort(() => 0.5 - Math.random());
                currentQuestions = shuffled.slice(0, maxQuestions);
            } else {
                // じゅんばん どおり の ばあい（はじめから 5個）
                currentQuestions = allFishData.slice(0, maxQuestions);
            }

            // 画面を きりかえる
            screenStart.classList.add("hidden");
            screenQuiz.classList.remove("hidden");

            setQuestion();
        }

        // ==========================================
        // もんだい を だす
        // ==========================================
        function setQuestion() {
            const q = currentQuestions[currentIndex];
            
            // もんだい ばんごう
            questionNumberText.textContent = `${currentIndex + 1} もんめ`;
            
            // 画像をセットし、シルエット（真っ黒）にする
            fishImage.src = q.img;
            fishImage.classList.remove("hint-mode");
            fishImage.classList.add("silhouette");

            // ひんとボタンを表示状態に戻す
            document.getElementById("hint-btn").style.display = "block";

            // アニメーションを リセット
            fishImage.classList.remove("fade-in", "swim-in");
            void fishImage.offsetWidth; // リフロー（アニメーションさいせい の ため）
            fishImage.classList.add("swim-in"); // スィーッと 登場 する クラス に 変更

            // せんたくし を クリア
            optionsContainer.innerHTML = "";

            // せんたくし を シャッフル（ボタンの場所を毎回かえるため）
            let shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());

            // ボタン を つくる
            shuffledOptions.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.textContent = optionText;
                // ボタンの 色を 順番に かえる
                const colorClass = btnColors[index % btnColors.length];
                btn.className = `kirie-btn ${colorClass} text-xl font-bold py-4 px-6 w-full kirie-text`;
                
                // クリック したときの 処理
                btn.onclick = () => checkAnswer(optionText, q.name);
                
                optionsContainer.appendChild(btn);
            });
        }

        // ==========================================
        // こたえあわせ
        // ==========================================
        function checkAnswer(selected, correct) {
            popupResult.classList.remove("hidden");
            
            // ポップアップ画面に本来のカラー画像を表示させる
            const q = currentQuestions[currentIndex];
            resultImage.src = q.img;
            
            // こたえあわせ で シルエット（真っ黒）や ヒント を かいじょ して、いろ を だす
            fishImage.classList.remove("silhouette", "hint-mode");
            
            // アニメーションのクラスをリセットしておく
            resultImage.className = "max-w-full max-h-full object-contain cursor-pointer";

            if (selected === correct) {
                // せいかい
                score++;
                correctFishes.push(q); // せいかい した おさかな を ほぞん
                // 「すごいね！」か「やったね！」をランダムに選ぶ
                const successMessages = ["すごいね！", "やったね！"];
                const randomMessage = successMessages[Math.floor(Math.random() * successMessages.length)];
                
                popupTitle.textContent = randomMessage;
                popupTitle.className = "text-4xl font-bold mb-4 text-red-500 kirie-title";
                popupText.innerHTML = `せいかい は<br>「${correct}」でした！`;
            } else {
                // ざんねん -> おしい！に変更
                popupTitle.textContent = "おしい！";
                popupTitle.className = "text-4xl font-bold mb-4 text-blue-500 kirie-title";
                popupText.innerHTML = `せいかい は<br>「${correct}」でした！`;
            }

            // まめちしき を ひょうじ
            popupTrivia.innerHTML = `💡 まめちしき<br><span class="text-sm">${q.trivia}</span>`;
        }

        // ==========================================
        // けっか がぞう を タップ したとき の アニメーション
        // ==========================================
        function playResultAnimation() {
            const anims = ["anim-spin", "anim-flip", "anim-shake"];
            const randomAnim = anims[Math.floor(Math.random() * anims.length)];
            
            // 連続でタップしてもアニメーションが再生されるように一度クラスを消す
            resultImage.classList.remove("anim-spin", "anim-flip", "anim-shake");
            void resultImage.offsetWidth; // リフロー
            
            resultImage.classList.add(randomAnim);
        }

        // ==========================================
        // ひんと を だす
        // ==========================================
        function showHint() {
            fishImage.classList.remove("silhouette");
            fishImage.classList.add("hint-mode");
            // ひんとボタンを消す（1回だけ使えるようにする）
            document.getElementById("hint-btn").style.display = "none";
        }

        // ==========================================
        // つぎの もんだい へ
        // ==========================================
        function nextQuestion() {
            popupResult.classList.add("hidden");
            currentIndex++;

            if (currentIndex < currentQuestions.length) {
                // まだ もんだい が ある
                setQuestion();
            } else {
                // ぜんぶ おわった
                showEndScreen();
            }
        }

        // ==========================================
        // おわり の がめん
        // ==========================================
        function showEndScreen() {
            screenQuiz.classList.add("hidden");
            screenEnd.classList.remove("hidden");
            finalScoreText.textContent = `${score} もん`;
        }

        // ==========================================
        // すいそう を みる
        // ==========================================
        function showAquarium() {
            screenEnd.classList.add("hidden");
            screenAquarium.classList.remove("hidden");
            
            aquariumFishArea.innerHTML = ""; // すいそう を いったん クリア
            
            if (correctFishes.length === 0) {
                aquariumFishArea.innerHTML = '<p class="text-gray-500 text-center mt-20 font-bold">おさかな が いないみたい...</p>';
                return;
            }
            
            // せいかい した おさかな を はいち
            correctFishes.forEach((fish) => {
                const img = document.createElement("img");
                img.src = fish.img;
                img.alt = fish.name;
                // フワフワ アニメーション を つける
                img.className = "absolute object-contain float-anim cursor-pointer drop-shadow-md";
                
                // おおきさ を ランダム に（60px 〜 110px）
                const size = 60 + Math.random() * 50; 
                img.style.width = `${size}px`;
                img.style.height = `${size}px`;
                
                // ばしょ を ランダム に（すいそう の わく の なか で はみださないように）
                const posX = 5 + Math.random() * 65; // 5% 〜 70%
                const posY = 5 + Math.random() * 65; // 5% 〜 70%
                img.style.left = `${posX}%`;
                img.style.top = `${posY}%`;
                
                // アニメーション の タイミング を ずらす
                img.style.animationDelay = `${Math.random() * 2}s`;
                
                // タップ した とき に くるっと まわる アクション
                img.onclick = () => {
                    img.classList.remove("float-anim");
                    void img.offsetWidth; // リフロー
                    img.classList.add("anim-spin"); 
                    // アニメーション が おわったら もと に もどす
                    setTimeout(() => {
                        img.classList.remove("anim-spin");
                        img.classList.add("float-anim");
                    }, 600);
                };
                
                aquariumFishArea.appendChild(img);
            });
        }

        // ==========================================
        // もういちど あそぶ
        // ==========================================
        function resetGame() {
            screenEnd.classList.add("hidden");
            screenAquarium.classList.add("hidden"); // すいそう がめん も かくす
            screenStart.classList.remove("hidden");
        }

        // ==========================================
        // はいけい どうが の しぜんな ループ（クロスフェード）
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const vid1 = document.getElementById('bg-video-1');
            const vid2 = document.getElementById('bg-video-2');
            let activeVid = vid1;
            let inactiveVid = vid2;

            // どうが が よみこまれたら さいせい
            vid1.play().catch(() => {
                console.log("じどう さいせい が ブロック されました");
            });

            // 0.1びょう ごとに さいせい じかん を チェック
            setInterval(() => {
                // どうが の おわり が 1びょういない に ちかづいたら
                if (activeVid.duration && (activeVid.duration - activeVid.currentTime < 1.0)) {
                    
                    // まだ きりかえて いない ばあい
                    if (inactiveVid.style.opacity === "0" || inactiveVid.style.opacity === "") {
                        inactiveVid.currentTime = 0; // さいしょ から
                        inactiveVid.play().catch(e => {});
                        
                        // クロスフェード（じわっと きりかえ）
                        inactiveVid.style.opacity = "1";
                        activeVid.style.opacity = "0";
                        
                        // やくわり を こうたい
                        let temp = activeVid;
                        activeVid = inactiveVid;
                        inactiveVid = temp;
                    }
                }
            }, 100);
        });

    </script>
</body>
