<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
  <title>年代別クイズ TIME SHOCK!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="main-body">

  <div id="flash-layer" class="time-shock-flash"></div>
  <div id="crack-layer" class="crack-overlay"></div>

  <!-- 横向き推奨画面 -->
  <div id="rotate-message">
    <p style="font-size: 24px; margin-bottom: 10px;">🔄 スマホを【横向き】にしてください</p>
  </div>

  <!-- 🎬 0. 導入ムービー画面 -->
  <div id="movie-overlay" class="overlay">
    <video id="intro-video" src="movie.mp4" playsinline muted autoplay preload="auto"></video>
    <button id="skip-btn" onclick="event.stopPropagation(); skipMovie();">SKIP ⏩</button>
  </div>

  <!-- 1. ホーム/設定画面 -->
  <div id="start-overlay" class="overlay hidden">
    <h1 style="font-size: 36px; color: #ffc107; text-shadow: 0 0 20px #ffc107;">QUIZ TIME SHOCK</h1>
    
    <!-- 年代選択 -->
    <div class="setting-group">
      <span class="setting-label">クイズの年代を選択</span>
      <div class="btn-group">
        <button class="opt-btn active" onclick="selectEra('1990年代', this)">1990年代</button>
        <button class="opt-btn" onclick="selectEra('2000年代', this)">2000年代</button>
        <button class="opt-btn" onclick="selectEra('2010年代', this)">2010年代</button>
      </div>
    </div>

    <!-- 時間制限選択 -->
    <div class="setting-group">
      <span class="setting-label">時間制限</span>
      <div class="btn-group">
        <button class="opt-btn active" onclick="selectTimerMode(true, this)">あり (1問10秒 / 全120秒)</button>
        <button class="opt-btn" onclick="selectTimerMode(false, this)">　なし　　</button>
      </div>
    </div>

    <button class="menu-btn" onclick="startGame()">GAME START</button>
  </div>

  <!-- 2. リザルト画面 -->
  <div id="result-overlay" class="overlay hidden">
    <h1 id="result-title" style="font-size: 36px;">GAME OVER</h1>
    <p id="result-desc" style="font-size: 20px; font-family: sans-serif; white-space: pre-wrap; text-align: center; z-index: 101;"></p>
    
    <div class="result-btn-group">
      <button class="menu-btn" onclick="showHome()">トップ画面に戻る</button>
      <button class="menu-btn sub-btn" onclick="showReview()">正解と解説をみる</button>
    </div>
  </div>

  <!-- 3. 正解・解説一覧画面 -->
  <div id="review-overlay" class="overlay hidden">
    <h2 style="font-size: 28px; color: #ffc107; margin-top: 10px;">正解と解説</h2>
    <div id="review-list" class="review-scroll-container">
      <!-- JavaScriptで動的生成 -->
    </div>
    <button class="menu-btn" onclick="showHome()" style="margin-bottom: 10px;">トップ画面に戻る</button>
  </div>

  <!-- メインゲーム画面 -->
  <div id="game-container">
    <div class="left-side">
      <div class="clock-dial" id="dial">
        <div class="clock-center">
          <div class="time-display" id="timer-text">120</div>
          <div class="score-display" id="correct-text">正解: 0/12</div>
        </div>
      </div>
    </div>

    <div class="right-side">
      <div class="target-message" id="era-badge">10問正解をめざせ！</div>
      
      <div class="quiz-box">
        <p class="quiz-text" id="quiz-question">問題を読み込み中...</p>
      </div>
      <div class="choices-grid">
        <button class="choice-btn" onclick="selectAnswer(0)" id="btn0">選択肢1</button>
        <button class="choice-btn" onclick="selectAnswer(1)" id="btn1">選択肢2</button>
        <button class="choice-btn" onclick="selectAnswer(2)" id="btn2">選択肢3</button>
        <button class="choice-btn" onclick="selectAnswer(3)" id="btn3">選択肢4</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
