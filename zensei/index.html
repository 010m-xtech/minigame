<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>前世診断｜あなたの前世は何者？</title>
  <meta name="description" content="生年月日と日常のクセから、あなたの前世を占う前世診断。">
  <meta name="theme-color" content="#0d0e15">
  <meta property="og:title" content="前世診断">
  <meta property="og:description" content="普段の何気ない行動から、あなたの前世を占います。">
  <meta property="og:image" content="result7.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e15;
      --pink: #ff3366;
      --orange: #ff6633;
      --gold: #ffd700;
      --amber: #ff9933;
      --cyan: #4deeea;
      --accent: var(--pink);
      --card: rgba(18, 22, 40, 0.88);
      --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ---------- 背景（background.jpg があれば重ねて表示、無ければグラデのみ） ---------- */
    #bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        linear-gradient(180deg, rgba(10,15,30,.55), rgba(10,15,30,.8)),
        url('background.jpg') center / cover no-repeat,
        radial-gradient(ellipse at 50% 0%, #2a1f4d 0%, #14152b 45%, #0a0b14 100%);
      transition: filter .8s;
    }
    body.is-result #bg {
      background:
        linear-gradient(180deg, rgba(10,10,20,.5), rgba(10,10,20,.78)),
        url('result_bg.jpg') center / cover no-repeat,
        radial-gradient(ellipse at 50% 0%, #3a1f3f 0%, #17142b 50%, #0a0b14 100%);
    }
    #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .app {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px; margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
    }
    .screen {
      display: none;
      min-height: 100vh; min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      flex-direction: column; justify-content: center; align-items: center;
    }
    .screen.active { display: flex; animation: screenIn .5s ease both; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- 共通パーツ ---------- */
    h1 {
      font-size: 2.4rem; font-weight: 900; text-align: center; letter-spacing: .08em;
      color: var(--pink);
      text-shadow: 0 0 14px rgba(233,189,92,.8), 0 0 40px rgba(233,189,92,.35);
      margin-bottom: 8px;
    }
    .eyebrow { text-align: center; font-size: .78rem; letter-spacing: .4em; color: #b9b3d6; margin-bottom: 6px; }
    .subtitle { text-wrap: balance; text-align: center; font-size: .95rem; color: #e6e3f5; margin-bottom: 26px; }

    .btn {
      width: 100%; padding: 17px; border: none; border-radius: 40px;
      background: linear-gradient(45deg, var(--pink), var(--orange));
      color: #fff; font: inherit; font-size: 1.15rem; font-weight: 700; letter-spacing: .04em;
      cursor: pointer; margin-top: 14px;
      box-shadow: 0 4px 24px rgba(233,189,92,.55);
      transition: transform .12s, box-shadow .2s, opacity .2s;
    }
    .btn:hover { box-shadow: 0 6px 30px rgba(233,189,92,.75); }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .option:focus-visible, select:focus-visible, .skip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .btn.ghost {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
      box-shadow: none; font-size: 1rem;
    }
    .btn.pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 4px 24px rgba(233,189,92,.5); } 50% { box-shadow: 0 4px 38px rgba(201,143,43,.9); } }

    /* ---------- イントロ ---------- */
    .panel {
      width: 100%; padding: 22px 18px 20px; border-radius: 20px;
      background: var(--card); border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .panel label, .panel .label { display: block; font-size: .95rem; font-weight: 700; margin-bottom: 10px; color: #f3f1ff; }
    .birth-group { display: flex; gap: 8px; }
    .select-wrapper { position: relative; flex: 1; }
    .select-wrapper::after {
      content: '▼'; font-size: .7rem; color: #ccc; position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%); pointer-events: none;
    }
    select {
      width: 100%; padding: 14px 8px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(20,25,45,.9);
      color: #fff; font: inherit; font-size: 1rem; text-align: center; text-align-last: center;
      -webkit-appearance: none; appearance: none; outline: none;
    }
    select:focus { border-color: var(--pink); box-shadow: 0 0 10px rgba(233,189,92,.35); }
    .note { margin-top: 10px; font-size: .75rem; color: #aaa6c7; text-align: center; }

    /* ---------- 質問 ---------- */
    .quiz-wrap { width: 100%; }
    .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .progress-bar { flex: 1; height: 8px; border-radius: 8px; background: rgba(255,255,255,.14); overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0; border-radius: 8px;
      background: linear-gradient(90deg, var(--pink), var(--gold));
      box-shadow: 0 0 10px rgba(233,189,92,.7);
      transition: width .45s cubic-bezier(.3,.9,.3,1);
    }
    .progress-text { font-size: .85rem; color: #d7d3ee; font-weight: 700; min-width: 3.2em; text-align: right; }
    .q-card { animation: qIn .4s ease both; }
    @keyframes qIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .q-num { font-size: .8rem; letter-spacing: .3em; color: var(--gold); margin-bottom: 6px; }
    .q-text { font-size: 1.3rem; font-weight: 700; line-height: 1.5; margin-bottom: 22px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
    .options { display: flex; flex-direction: column; gap: 11px; }
    .option {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 15px 16px; border-radius: 16px; font: inherit; font-size: 1rem; color: #fff;
      background: rgba(20,25,45,.82); border: 1.5px solid rgba(255,255,255,.16);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; transition: transform .12s, border-color .2s, background .2s;
    }
    .option .mark {
      flex: none; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center;
      font-size: .75rem; font-weight: 700; color: #cfcbe8;
    }
    .option:hover { border-color: rgba(233,189,92,.7); background: rgba(40,28,60,.9); }
    .option:active { transform: scale(.98); }
    .option.chosen { border-color: var(--pink); background: linear-gradient(135deg, rgba(233,189,92,.35), rgba(201,143,43,.25)); }
    .option.chosen .mark { background: var(--pink); border-color: var(--pink); color: #fff; }
    .back-link {
      margin-top: 18px; background: none; border: none; color: #bdb9d8; font: inherit; font-size: .88rem;
      text-decoration: underline; cursor: pointer; padding: 8px;
    }
    .back-link[hidden] { display: none; }

    /* ---------- 動画 ---------- */
    #video-screen {
      position: fixed; inset: 0; z-index: 100; background: #000; display: none;
    }
    #video-screen.show { display: block; animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #warp { display: block; width: 100%; height: 100%; }
    #toast-video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
    @keyframes caption { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .skip {
      position: absolute; left: 16px; top: max(16px, env(safe-area-inset-top));
      padding: 8px 14px; border-radius: 20px; font: inherit; font-size: .8rem; color: #fff;
      background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.4); cursor: pointer;
      opacity: 0; pointer-events: none; transition: opacity .5s;
    }
    .skip.visible { opacity: 1; pointer-events: auto; }

    #flash { position: fixed; inset: 0; z-index: 200; background: #fff; opacity: 0; pointer-events: none; }
    #flash.on { opacity: 1; }
    #flash.fade { transition: opacity 1.2s ease; opacity: 0; }

    /* ---------- 結果 ---------- */
    #result-screen { justify-content: flex-start; padding-top: max(22px, env(safe-area-inset-top)); }
    .result-head { text-align: center; margin-bottom: 14px; }
    .result-head .eyebrow { color: var(--gold); letter-spacing: .5em; }
    .result-card {
      width: 100%; border-radius: 22px; padding: 16px 16px 18px; text-align: center;
      background: var(--card); border: 2px solid var(--accent);
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 24px rgba(255,255,255,.03);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .hero-img-container {
      position: relative; width: 100%; aspect-ratio: 900 / 490; border-radius: 14px; overflow: hidden;
      margin-bottom: 16px; border: 1px solid rgba(255,255,255,.2); background: #14152b;
    }
    .hero-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-img-container::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 70%, rgba(0,0,0,.35));
    }
    .past-life-title {
      font-size: 1.6rem; font-weight: 900; color: var(--gold); line-height: 1.4; margin-bottom: 16px;
      text-shadow: 0 0 12px rgba(244,213,132,.55);
    }
    .story-box {
      background: rgba(0,0,0,.4); border-left: 3px solid var(--accent); padding: 12px 14px;
      border-radius: 0 10px 10px 0; font-size: .92rem; line-height: 1.75; color: #ebe9f7; text-align: left; margin-bottom: 14px;
    }
    .impact-box { background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px 14px; text-align: left; margin-bottom: 14px; font-size: .9rem; line-height: 1.6; }
    .impact-item + .impact-item { margin-top: 8px; }
    .impact-tag-talent { color: var(--cyan); font-weight: 700; display: block; font-size: .8rem; }
    .impact-tag-weak { color: #ff7b7b; font-weight: 700; display: block; font-size: .8rem; }
    .message-box {
      margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; font-size: .9rem; line-height: 1.7; text-align: left;
      background: linear-gradient(135deg, rgba(120,140,255,.16), rgba(190,120,255,.14)); border: 1px solid rgba(170,160,255,.35);
    }
    .message-box .tag { display: block; font-size: .78rem; font-weight: 700; color: #c5bfff; margin-bottom: 3px; letter-spacing: .05em; }
    .menu-box-large {
      background: linear-gradient(135deg, rgba(255,153,51,.17), rgba(233,189,92,.15));
      padding: 16px 12px; border-radius: 14px; border: 1.5px dashed var(--amber);
      box-shadow: inset 0 0 15px rgba(255,153,51,.1);
    }
    .menu-box-title { color: var(--amber); font-size: .85rem; margin-bottom: 6px; font-weight: 700; letter-spacing: .05em; }
    .menu-box-value { color: var(--gold); font-weight: 900; font-size: 1.28rem; line-height: 1.4; text-shadow: 0 0 10px rgba(244,213,132,.55); }

    .result-actions { width: 100%; margin-top: 6px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 300;
      background: rgba(255,255,255,.95); color: #222; padding: 10px 18px; border-radius: 24px;
      font-size: .9rem; font-weight: 700; opacity: 0; pointer-events: none; transition: .3s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 結果の順次表示 */
    .reveal { opacity: 0; transform: translateY(14px); }
    .revealed .reveal { animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * .22s); }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .revealed .hero-img-container img { animation: zoomIn 1.6s ease-out both; }
    @keyframes zoomIn { from { transform: scale(1.18); filter: brightness(2) blur(4px); } to { transform: scale(1); filter: none; } }

    #sparkles { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    .sparkle {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      background: radial-gradient(circle, #fff, var(--gold) 50%, transparent 70%);
      animation: floatUp linear forwards;
    }
    @keyframes floatUp { from { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-110vh) scale(1.1); opacity: 0; } }

    /* ---------- 磨き込み：イントロ ---------- */
    .hero { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 34px 0 8px; margin-bottom: 4px; }
    .magic {
      position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px 0 0 -165px;
      opacity: .55; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255,120,170,.6));
    }
    .magic .ring-a { transform-origin: 50% 50%; animation: spin 60s linear infinite; }
    .magic .ring-b { transform-origin: 50% 50%; animation: spin 38s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero h1, .hero .eyebrow { position: relative; }
    h1 {
      background: linear-gradient(100deg, #ff3366 0%, #ff9a5a 35%, #ffe08a 50%, #ff9a5a 65%, #ff3366 100%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: shimmer 5s linear infinite; text-shadow: none;
      filter: drop-shadow(0 0 14px rgba(233,189,92,.65));
    }
    @keyframes shimmer { to { background-position: -250% 0; } }
    .marquee { width: 100%; overflow: hidden; margin-top: 22px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .marquee-track { display: flex; gap: 10px; width: max-content; animation: marquee 40s linear infinite; }
    .marquee-track img { height: 62px; width: 110px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); opacity: .85; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    .option { animation: optIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--n, 0) * .07s + .1s); }
    @keyframes optIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .option.chosen { animation: none; box-shadow: 0 0 18px rgba(233,189,92,.5); }

    .shooting {
      position: fixed; z-index: 0; width: 120px; height: 2px; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff); border-radius: 2px;
      transform: rotate(35deg); opacity: 0; animation: shoot 1.1s ease-out forwards;
    }
    @keyframes shoot { 0% { opacity: 0; translate: 0 0; } 15% { opacity: 1; } 100% { opacity: 0; translate: 260px 182px; } }


    /* ---------- 磨き込み：動画オーバーレイ ---------- */
    .year-wrap { position: absolute; left: 0; right: 0; top: 18%; text-align: center; pointer-events: none; color: #fff; text-shadow: 0 0 16px rgba(120,200,255,.95), 0 0 40px rgba(120,200,255,.6); }
    .year-num { font-size: 3.4rem; font-weight: 900; letter-spacing: .06em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .year-num small { font-size: 1.1rem; margin-left: 4px; letter-spacing: .1em; }


    /* ---------- テロップ（年号）：絵本の見返しのような静かな金文字 ---------- */
    #video-screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; pointer-events: none;
      background: linear-gradient(to top, rgba(14,14,38,.74), rgba(14,14,38,.38) 45%, rgba(14,14,38,0)); }
    .year-wrap { top: auto; bottom: max(7%, calc(env(safe-area-inset-bottom) + 28px)); z-index: 2; color: var(--cream, #fbf1d4);
      text-shadow: 0 1px 14px rgba(14,12,34,.7), 0 0 26px rgba(244,213,132,.32); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .year-wrap::before, .year-wrap::after { content: ""; display: block; width: min(46vw, 190px); height: 1px; order: 0;
      background: linear-gradient(90deg, transparent, rgba(244,213,132,.85), transparent); }
    .year-wrap::after { order: 2; }
    .year-num { order: 1; font-size: 2.7rem; font-weight: 500; letter-spacing: .14em; text-indent: .14em; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
    .year-num small.bc { margin: 0 .55em 0 0; font-size: .85rem; letter-spacing: .24em; }
    .year-num small { font-size: .95rem; font-weight: 500; margin-left: 6px; letter-spacing: .2em; color: var(--gold, #f4d584); }

    /* ---------- 磨き込み：カードめくり ---------- */
    #gate-screen { gap: 22px; text-align: center; }
    .gate-lead { font-size: 1.05rem; letter-spacing: .3em; color: #f1ecff; text-shadow: 0 0 14px rgba(190,160,255,.9); }
    .tarot-scene { perspective: 900px; }
    .tarot {
      position: relative; width: 218px; height: 336px; border: none; background: none; cursor: pointer; color: #fff;
      transform-style: preserve-3d; animation: bob 3.6s ease-in-out infinite; font: inherit;
    }
    .tarot.flip { animation: none; transition: transform .55s cubic-bezier(.5,0,.8,.3); transform: rotateY(90deg) scale(1.08); }
    @keyframes bob { 0%,100% { transform: translateY(0) rotateZ(-1.2deg); } 50% { transform: translateY(-12px) rotateZ(1.2deg); } }
    .tarot-face {
      position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,120,190,.35), transparent 55%),
        linear-gradient(160deg, #2b1a5a, #170f36 55%, #3a1747);
      border: 2px solid #e8c46a;
      box-shadow: 0 0 0 5px rgba(232,196,106,.18), 0 0 40px rgba(190,120,255,.7), 0 0 90px rgba(233,189,92,.35);
    }
    .tarot-face::before {
      content: ''; position: absolute; inset: 10px; border: 1px solid rgba(232,196,106,.55); border-radius: 12px;
    }
    .tarot-face::after {
      content: ''; position: absolute; top: -60%; left: -60%; width: 60%; height: 220%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      transform: rotate(20deg); animation: foil 3.2s ease-in-out infinite;
    }
    @keyframes foil { 0% { left: -70%; } 55%,100% { left: 130%; } }
    .tarot-face svg { position: absolute; inset: 0; margin: auto; width: 78%; height: 78%; }
    .gate-hint { font-size: .9rem; color: #d8d1f5; animation: caption 2.2s ease-in-out infinite; }

    /* ---------- 磨き込み：結果 ---------- */
    .hero-img-container .shine {
      position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; z-index: 1; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-18deg);
    }
    .revealed .hero-img-container .shine { animation: sweep 1.6s ease-in-out 1.2s 1 both; }
    @keyframes sweep { to { left: 130%; } }
    .revealed .past-life-title { animation: titleIn .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: .66s; filter: blur(8px); letter-spacing: .25em; }
    @keyframes titleIn { to { opacity: 1; transform: none; filter: blur(0); letter-spacing: .02em; } }
    .result-card { position: relative; }
    .revealed .result-card { animation: cardGlow 3.2s ease-in-out 1.6s infinite; }
    @keyframes cardGlow { 0%,100% { box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 46px color-mix(in srgb, var(--accent) 80%, transparent); } }


    /* ================= 世界観統一：夜空の藍 × 金箔 × 絵本の明朝 ================= */
    :root {
      --pink: #e9bd5c; --orange: #c98f2b; --gold: #f4d584; --amber: #e3b650;
      --cyan: #a6e0d6; --cream: #f7eed8; --ink: #2a1a05;
      --display: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    }
    h1, .eyebrow, .q-num, .q-text, .past-life-title, .menu-box-value, .menu-box-title, .gate-lead,
    .year-num, .btn, .label, .tag { font-family: var(--display); }

    h1 {
      font-size: 2.7rem; font-weight: 800; letter-spacing: .2em; text-indent: .2em;
      background: linear-gradient(100deg, #f7eed8 0%, #f4d584 38%, #fff6d6 50%, #f4d584 62%, #d9a441 100%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 14px rgba(233,189,92,.5));
    }
    .eyebrow { font-size: .72rem; letter-spacing: .55em; color: #cdbf9a; font-weight: 500; }
    .subtitle { color: #ece6d6; line-height: 1.9; }
    .magic { filter: drop-shadow(0 0 8px rgba(233,189,92,.5)); opacity: .5; }

    /* ボタン：金箔のプレート */
    .btn {
      position: relative; width: 100%; padding: 17px 20px; margin-top: 16px;
      border: 1px solid #8a5d12; border-radius: 16px;
      background: linear-gradient(180deg, #fbe9b0 0%, #ecc566 48%, #cf9a35 100%);
      color: var(--ink); font-size: 1.12rem; font-weight: 800; letter-spacing: .22em; text-indent: .22em;
      text-shadow: 0 1px 0 rgba(255,255,255,.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(120,70,0,.22),
                  0 6px 22px rgba(201,143,43,.35), 0 0 0 1px rgba(255,236,170,.25);
      transition: transform .12s, filter .2s, box-shadow .2s; overflow: hidden;
    }
    .btn::before {
      content: ''; position: absolute; inset: 4px; border-radius: 11px; pointer-events: none;
      border: 1px solid rgba(90,55,0,.35);
    }
    .btn::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg);
    }
    .btn:hover { filter: brightness(1.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(120,70,0,.22), 0 8px 28px rgba(233,189,92,.5), 0 0 0 1px rgba(255,236,170,.4); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn.pulse { animation: none; }
    .btn.pulse::after { animation: btnSweep 3.6s ease-in-out infinite; }
    @keyframes btnSweep { 0% { left: -60%; } 45%, 100% { left: 140%; } }
    .btn.ghost {
      background: rgba(18,20,46,.62); color: var(--cream); border: 1px solid rgba(244,213,132,.6);
      font-size: 1rem; letter-spacing: .2em; text-shadow: none; box-shadow: 0 0 0 1px rgba(244,213,132,.08);
    }
    .btn.ghost::before { border-color: rgba(244,213,132,.22); }
    .btn.ghost::after { display: none; }
    .btn.ghost:hover { background: rgba(244,213,132,.12); box-shadow: 0 0 20px rgba(233,189,92,.25); }
    .btn:focus-visible, .option:focus-visible, select:focus-visible, .skip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .back-link { color: #cdbf9a; letter-spacing: .08em; }

    .skip { font-family: var(--display); letter-spacing: .2em; border-color: rgba(244,213,132,.5); }

    /* パネル・入力 */
    .panel { border: 1px solid rgba(244,213,132,.28); border-radius: 20px; background: rgba(14,17,40,.82); box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 0 0 4px rgba(14,17,40,.9), inset 0 0 0 5px rgba(244,213,132,.12); }
    .panel .label { font-weight: 700; letter-spacing: .25em; color: var(--gold); font-size: .85rem; }
    select { border-color: rgba(244,213,132,.28); background: rgba(10,12,32,.9); color: var(--cream); }
    select:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(233,189,92,.35); }
    .select-wrapper::after { color: var(--gold); }
    .note { color: #a9a58f; }

    /* 質問 */
    .progress-fill { background: linear-gradient(90deg, #c98f2b, #f4d584); box-shadow: 0 0 10px rgba(233,189,92,.6); }
    .progress-text { font-family: var(--display); color: var(--gold); }
    .q-num { color: var(--gold); letter-spacing: .4em; font-size: .85rem; font-weight: 700; }
    .q-text { font-size: 1.32rem; font-weight: 700; line-height: 1.6; color: var(--cream); }
    .option {
      border-radius: 14px; border: 1px solid rgba(244,213,132,.24); background: rgba(14,17,40,.8);
      box-shadow: inset 0 0 0 3px rgba(14,17,40,.9), inset 0 0 0 4px rgba(244,213,132,.07);
    }
    .option .mark { font-family: var(--display); border: 1px solid rgba(244,213,132,.55); color: var(--gold); width: 28px; height: 28px; font-weight: 700; }
    .option:hover { border-color: rgba(244,213,132,.7); background: rgba(34,28,60,.9); }
    .option.chosen { border-color: var(--gold); background: linear-gradient(135deg, rgba(244,213,132,.24), rgba(201,143,43,.14)); box-shadow: 0 0 18px rgba(233,189,92,.4), inset 0 0 0 3px rgba(14,17,40,.5); }
    .option.chosen .mark { background: var(--gold); border-color: var(--gold); color: var(--ink); }

    /* 動画・カード */
    .gate-lead { letter-spacing: .35em; text-indent: .35em; font-weight: 700; color: var(--cream); text-shadow: 0 0 16px rgba(233,189,92,.7); }
    .gate-hint { font-family: var(--display); letter-spacing: .25em; color: #d8cfae; }

    /* 結果 */
    .result-head .eyebrow { color: var(--gold); letter-spacing: .6em; font-size: .8rem; }
    .result-card { border-width: 1.5px; }
    .result-card::before {
      content: ''; position: absolute; inset: 6px; border-radius: 17px; pointer-events: none;
      border: 1px solid rgba(244,213,132,.22);
    }
    .past-life-title { font-weight: 800; font-size: 1.62rem; color: var(--gold); letter-spacing: .04em; text-shadow: 0 0 14px rgba(244,213,132,.45); }
    .story-box { font-family: var(--display); font-weight: 500; font-size: .97rem; line-height: 2; color: #efe9d9; border-left: 2px solid var(--gold); background: rgba(0,0,0,.32); }
    .impact-tag-talent, .impact-tag-weak { font-family: var(--display); letter-spacing: .2em; font-size: .78rem; }
    .impact-tag-talent { color: var(--cyan); }
    .impact-tag-weak { color: #f2a590; }
    .impact-tag-talent::before, .impact-tag-weak::before { content: '✦ '; }
    .message-box { background: linear-gradient(135deg, rgba(120,140,255,.13), rgba(190,150,255,.1)); border: 1px solid rgba(190,180,255,.3); }
    .message-box .tag { color: #cfc9ff; letter-spacing: .2em; }
    .message-box .tag::before { content: '☾ '; }
    .menu-box-large {
      border: 1px solid rgba(244,213,132,.6);
      background: linear-gradient(135deg, rgba(244,213,132,.13), rgba(201,143,43,.07));
      box-shadow: inset 0 0 0 4px rgba(14,17,40,.55), inset 0 0 0 5px rgba(244,213,132,.2);
      padding: 18px 12px;
    }
    .menu-box-title { color: var(--amber); letter-spacing: .2em; font-weight: 700; }
    .menu-box-title::before { content: '✦ '; } .menu-box-title::after { content: ' ✦'; }
    .menu-box-value { font-weight: 800; letter-spacing: .06em; }


    /* ================= 1画面にまとめた質問 ================= */
    #intro-screen { justify-content: flex-start; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 0; }
    #intro-screen .hero { padding: 26px 0 4px; }
    #intro-screen .subtitle { margin-bottom: 14px; }
    #intro-screen .marquee { margin: 0 0 18px; }
    #q-list { width: 100%; display: flex; flex-direction: column; gap: 22px; margin-top: 24px; }
    .q-block { width: 100%; scroll-margin-top: 16px; }
    .q-block .q-num { margin-bottom: 4px; }
    .q-block .q-text { font-size: 1.1rem; line-height: 1.55; margin-bottom: 12px; }
    .q-block .options { gap: 9px; }
    .q-block .option { padding: 12px 14px; font-size: .95rem; }
    .q-block.done .q-num::after { content: ' ✓'; color: var(--cyan); }
    .start-bar {
      position: sticky; bottom: 0; z-index: 20; width: calc(100% + 40px); margin: 14px -20px 0;
      padding: 22px 20px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(8,9,22,0), rgba(8,9,22,.88) 38%);
    }
    .start-bar .btn { margin-top: 0; }
    .btn:disabled { cursor: not-allowed; filter: saturate(.35) brightness(.75); box-shadow: none; }
    .btn:disabled::after { animation: none; display: none; }


    /* ================= タップで開く質問 ================= */
    #q-list { gap: 12px; }
    .q-block {
      border: 1px solid rgba(244,213,132,.26); border-radius: 16px; background: rgba(14,17,40,.82);
      box-shadow: inset 0 0 0 3px rgba(14,17,40,.9), inset 0 0 0 4px rgba(244,213,132,.07);
      overflow: hidden; transition: border-color .25s, box-shadow .25s;
    }
    .q-block.open { border-color: rgba(244,213,132,.7); box-shadow: 0 0 22px rgba(233,189,92,.18), inset 0 0 0 3px rgba(14,17,40,.9), inset 0 0 0 4px rgba(244,213,132,.12); }
    .q-block.done:not(.open) { border-color: rgba(244,213,132,.5); }
    .q-block .q-num { margin-bottom: 3px; }
    .q-block .q-text { font-size: 1.02rem; margin-bottom: 0; }
    .q-answer { margin-top: 7px; font-size: .88rem; color: #a9a58f; letter-spacing: .04em; }
    .q-block.done .q-answer { color: var(--gold); font-weight: 700; }
    .q-block.done .q-answer::before { content: '▸ '; }
    .chev {
      flex: none; width: 9px; height: 9px; margin-right: 4px; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
      transform: rotate(45deg) translateY(-2px); transition: transform .3s;
    }
    .q-block.open .chev { transform: rotate(-135deg) translateY(-2px); }


    /* ================= スクロール無しの選択画面 ================= */
    #intro-screen { min-height: 100vh; min-height: 100dvh; padding-top: max(10px, env(safe-area-inset-top)); }
    #intro-screen .hero { padding: 14px 0 0; }
    #intro-screen .magic { width: 230px; height: 230px; margin: -115px 0 0 -115px; }
    #intro-screen h1 { font-size: 2.1rem; margin-bottom: 2px; }
    #intro-screen .eyebrow { font-size: .62rem; margin-bottom: 2px; }
    #intro-screen .subtitle { font-size: .8rem; line-height: 1.6; margin: 6px 0 10px; }
    #intro-screen .marquee { margin: 0 0 10px; }
    #intro-screen .marquee-track img { height: 46px; width: 82px; }
    #intro-screen .panel { padding: 10px 14px 9px; border-radius: 16px; }
    #intro-screen .panel .label { margin-bottom: 7px; font-size: .78rem; }
    #intro-screen select { padding: 10px 6px; font-size: .95rem; }
    #intro-screen .note { margin-top: 6px; font-size: .66rem; }
    #q-list { margin-top: 10px; gap: 8px; }
    .q-block .q-num { grid-row: 1; grid-column: 1; margin: 0; font-size: .8rem; }
    .q-block .q-text { grid-row: 1; grid-column: 2; font-size: .92rem; line-height: 1.4; }
    .q-answer { grid-row: 2; grid-column: 2; margin-top: 3px; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-block.done .q-num::after { content: ''; }
    .q-block.done .q-num { color: var(--cyan); }
    .q-block.done .q-num::before { content: '✓ '; }
    .chev { transform: rotate(-45deg); margin-right: 2px; }
    .start-bar { margin-top: auto; padding-top: 14px; }
    @media (max-height: 780px) { #intro-screen .marquee { display: none; } }
    @media (max-height: 760px) {
      #intro-screen .hero { padding-top: 6px; } #intro-screen h1 { font-size: 1.9rem; }
      #intro-screen .subtitle { margin: 3px 0 8px; } #q-list { gap: 6px; margin-top: 8px; }
      .q-block .q-text { font-size: .88rem; line-height: 1.35; }
      .start-bar { padding: 10px 20px max(12px, env(safe-area-inset-bottom)); }
    }
    @media (max-height: 700px) {
      #intro-screen .magic, #intro-screen .eyebrow, #intro-screen .note { display: none; }
      #intro-screen .subtitle br { display: none; } #intro-screen .subtitle { font-size: .76rem; }
      #intro-screen select { padding: 8px 6px; } #intro-screen .panel { padding: 9px 12px; }
      .q-answer { font-size: .74rem; margin-top: 1px; } .btn { padding: 14px 18px; }
    }
    @media (max-height: 600px) {
      #intro-screen h1 { font-size: 1.55rem; } #intro-screen .hero { padding-top: 2px; }
      #intro-screen .panel .label { display: none; } #intro-screen select { padding: 6px 4px; font-size: .85rem; }
      .q-block .q-text { font-size: .8rem; }
      .q-block.done .q-text { color: var(--gold); }
      .start-bar { padding-top: 6px; } .btn { padding: 11px 16px; font-size: 1rem; }
    }
    @media (max-height: 640px) { #intro-screen .magic { display: none; } #intro-screen .hero { padding-top: 6px; } #intro-screen .subtitle br { display: none; } }


    /* ================= 質問文 ＋ その下に答えの枠（タップで選択肢を開く） ================= */
    .q-block { padding: 11px 12px 12px; }
    .q-block .q-top { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; }
    .q-block .q-top .q-num { margin: 0; font-size: .8rem; }
    .q-block .q-top .q-num::before, .q-block .q-top .q-num::after { content: none !important; }
    .q-block .q-top .q-text { margin: 0; font-size: .98rem; line-height: 1.45; }
    .q-block .q-field {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 8px; padding: 10px 12px;
      text-align: left; font: inherit; cursor: pointer; color: var(--gold); font-weight: 700; font-size: .92rem;
      background: rgba(255,255,255,.05); border: 1px solid rgba(244,213,132,.5); border-radius: 11px;
      transition: border-color .2s, background .2s;
    }
    .q-block .q-field:hover, .q-block.open .q-field { background: rgba(244,213,132,.1); border-color: rgba(244,213,132,.85); }
    .q-block .q-field:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .q-block .q-field .q-answer { display: block !important; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: inherit; color: inherit; font-weight: inherit; }
    .q-block .q-field .q-answer::before { content: none !important; }
    .q-block .q-field .chev { margin: 0 3px 0 0; transform: rotate(45deg) translateY(-2px); }
    @media (max-height: 760px) { .q-block { padding: 8px 11px 9px; } .q-block .q-field { margin-top: 6px; padding: 8px 11px; } .q-block .q-top .q-text { font-size: .88rem; line-height: 1.35; } }
    @media (max-height: 640px) { .q-block { padding: 6px 10px 7px; } .q-block .q-field { margin-top: 4px; padding: 6px 10px; font-size: .82rem; } .q-block .q-top .q-text { font-size: .8rem; } }

    /* 1画面に4問がおさまるように詰める */
    @media (max-height: 960px) { #intro-screen .marquee { display: none; } #intro-screen .hero { padding-bottom: 6px; } }
    @media (max-height: 800px) { #intro-screen .note { display: none; } #q-list { gap: 7px; } }
    @media (max-height: 760px) { .q-block .q-top .q-text { font-size: .86rem; line-height: 1.3; } .q-block .q-field { padding: 7px 10px; font-size: .86rem; } }
    @media (max-height: 700px) { #intro-screen h1 { font-size: 1.6rem; } #intro-screen .hero { padding-top: 2px; padding-bottom: 0; } #intro-screen .panel { padding: 7px 12px; } #intro-screen .panel .label { display: none; } #q-list { gap: 5px; margin-top: 6px; } .q-block { padding: 6px 10px 7px; } .q-block .q-field { margin-top: 4px; } .btn { padding: 12px 16px; } }
    @media (max-height: 600px) { #intro-screen h1 { display: none; } }

    /* スタートボタンの上の余白を、質問どうしの間隔に回す */
    #intro-screen #q-list { flex: 1 1 auto; justify-content: space-evenly; gap: 6px; min-height: 0; }

    /* 見出し文を残したまま、4問がおさまるように詰める */
    @media (max-height: 900px) { #intro-screen .note { display: none; } .q-block { padding: 8px 11px 9px; } .q-block .q-field { margin-top: 6px; padding: 8px 11px; } #intro-screen select { padding: 8px 6px; } #intro-screen .panel { padding-bottom: 8px; } }
    @media (max-height: 660px) { .q-block { padding: 5px 9px 6px; } .q-block .q-field { margin-top: 3px; padding: 5px 9px; } .q-block .q-top .q-text { font-size: .76rem; line-height: 1.25; } #intro-screen .subtitle { font-size: .7rem; line-height: 1.4; margin: 2px 0 6px; } }

    /* 選択肢のシート */
    .sheet { position: fixed; inset: 0; z-index: 180; }
    .sheet[hidden] { display: none; }
    .sheet { display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-left)); }
    .sheet[hidden] { display: none; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(3,4,12,.66); }
    .sheet-panel {
      position: relative; width: min(100%, 460px); max-height: 86dvh; overflow-y: auto;
      padding: 18px 16px 16px;
      background: linear-gradient(180deg, #181a3d, #0d1028); border: 1px solid rgba(244,213,132,.45); border-bottom: none;
      border-radius: 20px; border-bottom: 1px solid rgba(244,213,132,.45); box-shadow: 0 14px 50px rgba(0,0,0,.6), inset 0 0 0 4px rgba(13,16,40,.9), inset 0 0 0 5px rgba(244,213,132,.1);
    }
    .sheet .option { animation: none; }
    .sheet-panel .q-num { margin-bottom: 4px; }
    .sheet-panel .q-text { font-size: 1.1rem; margin-bottom: 14px; }
    .sheet-panel .options { gap: 9px; }

    @media (prefers-reduced-motion: reduce) {
      .tarot { animation: none; }
      .shooting { display: none; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="app">

    <!-- ① イントロ（生年月日） -->
    <section id="intro-screen" class="screen active" aria-labelledby="app-title">
      <div class="hero">
        <svg class="magic" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="#e8c46a" stroke-width=".6">
          <g class="ring-a">
            <circle cx="100" cy="100" r="96" stroke-dasharray="2 3"/>
            <circle cx="100" cy="100" r="88"/>
            <polygon points="100,12 175,143 25,143" />
            <polygon points="100,188 25,57 175,57" />
          </g>
          <g class="ring-b" stroke="#ffe08a">
            <circle cx="100" cy="100" r="70" stroke-dasharray="6 4"/>
            <circle cx="100" cy="100" r="54"/>
            <path d="M100 30 L108 92 L170 100 L108 108 L100 170 L92 108 L30 100 L92 92 Z"/>
          </g>
        </svg>
        <div class="eyebrow">PAST LIFE READING</div>
        <h1 id="app-title">前世診断</h1>
      </div>
      <p class="subtitle">普段の何気ない行動から、あなたの前世を占います。<br>直感でお答えください。</p>
      <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee-track"></div></div>

      <div class="panel">
        <span class="label" id="birth-label">生年月日</span>
        <div class="birth-group" role="group" aria-labelledby="birth-label">
          <div class="select-wrapper"><select id="birth-year" aria-label="年"></select></div>
          <div class="select-wrapper"><select id="birth-month" aria-label="月"></select></div>
          <div class="select-wrapper"><select id="birth-day" aria-label="日"></select></div>
        </div>
        <p class="note">生年月日は保存・送信しません</p>
      </div>

      <div id="q-list"></div>

      <div class="start-bar">
        <button class="btn pulse" id="start-btn" type="button" disabled>あと4問</button>
      </div>
    </section>


    <!-- ②.5 カードめくり -->
    <section id="gate-screen" class="screen">
      <div class="gate-lead">あなたの前世が見つかりました</div>
      <div class="tarot-scene">
        <button class="tarot" id="tarot" type="button" aria-label="カードをめくって前世を見る">
          <div class="tarot-face">
            <svg viewBox="0 0 100 100" fill="none" stroke="#e8c46a" stroke-width=".8" aria-hidden="true">
              <circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="32" stroke-dasharray="2 2"/>
              <path d="M50 14 L57 43 L86 50 L57 57 L50 86 L43 57 L14 50 L43 43 Z" fill="rgba(232,196,106,.15)"/>
              <circle cx="50" cy="50" r="5" fill="#e8c46a"/>
              <path d="M50 4 v6 M50 90 v6 M4 50 h6 M90 50 h6" />
            </svg>
          </div>
        </button>
      </div>
      <div class="gate-hint">カードをタップしてめくる</div>
    </section>

    <!-- ③ 結果 -->
    <section id="result-screen" class="screen" aria-live="polite">
      <div class="result-head reveal" style="--i:0">
        <div class="eyebrow">あなたの前世は…</div>
      </div>
      <div class="result-card" id="result-card">
        <div class="hero-img-container reveal" style="--i:1">
          <img id="res-img" src="" alt="">
          <span class="shine"></span>
        </div>
        <div class="past-life-title reveal" style="--i:3" id="res-title"></div>
        <div class="story-box reveal" style="--i:4" id="res-story"></div>
        <div class="impact-box reveal" style="--i:5">
          <div class="impact-item"><span class="impact-tag-talent">今の才能</span><span id="res-talent"></span></div>
          <div class="impact-item"><span class="impact-tag-weak">今の弱点</span><span id="res-weak"></span></div>
        </div>
        <div class="message-box reveal" style="--i:6">
          <span class="tag">前世からのひとこと</span>
          <span id="res-message"></span>
        </div>
        <div class="menu-box-large reveal" style="--i:7">
          <div class="menu-box-title">前世あなたが愛したソウルフード</div>
          <div class="menu-box-value" id="res-menu"></div>
        </div>
      </div>
      <div class="result-actions reveal" style="--i:8">
        <button class="btn" id="retry-btn" type="button">もう１度診断する</button>
      </div>
    </section>
  </main>

  <!-- 選択肢のシート -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-q">
      <div class="q-num" id="sheet-num"></div>
      <h2 class="q-text" id="sheet-q"></h2>
      <div class="options" id="sheet-options" role="radiogroup" aria-labelledby="sheet-q"></div>
    </div>
  </div>

  <!-- 動画 -->

    /* ============================================================

     *  - 選んだ選択肢ごとに「前世タイプ」へ加点（3/2/1点）
     *  - 回答の組み合わせ＋生年月日で決まる（乱数は使わない。同じ入力なら必ず同じ結果）
     * ============================================================ */
    // 採点：選んだ選択肢ごとに「その前世に近い度合い（1〜3点）」を足し、合計がいちばん高い前世が結果。
    // 生年月日は、誕生日（1年を10に区切った区間）に対応する前世へ +2.5 点。
    // 答えが拮抗しているときに結果を動かす程度で、答えの傾向から大きくは外れない。乱数は使わない。
    // 同点のときだけ、選択肢への登場が少ないタイプ（＝その傾向がはっきり出た人）を優先し、
    // それでも並んだら回答の組み合わせから一意に決める。
    const TYPE_MEAN = (function () {
      const sum = new Array(results.length).fill(0);
      questionPool.forEach(q => q.options.forEach(o => Object.keys(o.s).forEach(t => { sum[t] += o.s[t] / q.options.length; })));
      return sum.map(v => v / questionPool.length);
    })();

    function computeResult(birth, picked) {
      const raw = new Array(results.length).fill(0);
      picked.forEach(({ q, opt }) => {
        const sc = questionPool[q].options[opt].s;
        Object.keys(sc).forEach(t => { raw[t] += sc[t]; });
      });
      if (birth && birth.m && birth.d) {
        const doy = Math.round((Date.UTC(2001, birth.m - 1, birth.d) - Date.UTC(2001, 0, 1)) / 86400000);
        raw[Math.floor(doy / 36.6) % results.length] += 2.5;
      }
      const top = Math.max.apply(null, raw);
      const tied = raw.map((v, i) => (v === top ? i : -1)).filter(i => i >= 0);
      if (tied.length === 1) return tied[0];
      const minMean = Math.min.apply(null, tied.map(i => TYPE_MEAN[i]));
      const pool = tied.filter(i => TYPE_MEAN[i] - minMean < 0.02);
      if (pool.length === 1) return pool[0];
      let h = 0;
      picked.forEach(({ q, opt }) => { h = (h * 31 + q * 4 + opt + 1) % 100003; });
      return pool[h % pool.length];
    }

        blk.appendChild(top);

     *  タイムスリップ演出
     *  動画（乾杯 → 時計が巻き戻る → 渦）を画面いっぱいに流し、年号を重ねる。
     *  動画が再生できないときは、演出を飛ばしてカード画面へ進む。
     * ============================================================ */
    function startTimeSlip() {
      const picked = questions.map((q, k) => ({ q, opt: answers[k] }));
      lastResult = computeResult(getBirth(), picked);

      const vs = $('video-screen'), skip = $('skip-btn');
      const cv = $('warp'), c = cv.getContext('2d');
      const yearNum = $('year-num'), yearWrap = vs.querySelector('.year-wrap');
      const era = ERAS[lastResult], startYear = new Date().getFullYear();
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const vid = $('toast-video');
      let W, H, raf = 0, started = false, bgc = null;

      function fit() {
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.width = Math.max(2, Math.round(innerWidth * DPR));
        H = cv.height = Math.max(2, Math.round(innerHeight * DPR));
      }
      // 縦長の動画：細い画面は全面に、横長の画面は中央に置いて左右は動画の色をぼかして延ばす
      function drawVideo() {
        const vw = vid.videoWidth || 720, vh = vid.videoHeight || 1280;
        if (W / H <= .75) {
          const sc = Math.max(W / vw, H / vh), dw = vw * sc, dh = vh * sc;
          c.drawImage(vid, (W - dw) / 2, (H - dh) / 2, dw, dh); return;
        }
        if (!bgc) { bgc = document.createElement('canvas'); bgc.width = 18; bgc.height = 32; }
        bgc.getContext('2d').drawImage(vid, 0, 0, 18, 32);
        c.save(); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
        c.drawImage(bgc, 0, 0, W, H); c.fillStyle = 'rgba(14,16,40,.45)'; c.fillRect(0, 0, W, H); c.restore();
        const sc = H / vh, dw = vw * sc; c.drawImage(vid, (W - dw) / 2, 0, dw, H);
      }

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      vs.classList.add('show');
      fit();
      window.addEventListener('resize', fit);
      yearNum.innerHTML = startYear + '<small>年</small>';
      yearWrap.style.opacity = 0;
      skip.classList.remove('visible');
      const skipTimer = setTimeout(() => skip.classList.add('visible'), 1500);
      finished = false;

      function finishWarp() {
        if (finished) return;
        finished = true;
        cancelAnimationFrame(raf); clearTimeout(skipTimer); clearTimeout(waitMax);
        window.removeEventListener('resize', fit);
        try { vid.pause(); } catch (e) {}
        yearWrap.style.opacity = '';
        const flash = $('flash');
        flash.className = 'on';
        setTimeout(() => {
          vs.classList.remove('show');
          showGate();
          requestAnimationFrame(() => { flash.className = 'fade'; });
          setTimeout(() => { flash.className = ''; }, 1400);
        }, reduceMotion ? 0 : 300);
      }
      skip.onclick = finishWarp;

      // 再生できないとき（読み込み失敗・8秒待っても始まらない）は演出を飛ばす
      const waitMax = setTimeout(() => { if (!started) finishWarp(); }, 8000);
      if (reduceMotion || !vid || vid.error || vid.networkState === 3) { finishWarp(); return; }
      vid.addEventListener('playing', () => { started = true; clearTimeout(waitMax); }, { once: true });
      Array.prototype.forEach.call(vid.querySelectorAll('source'), (so) => so.addEventListener('error', () => {
        if (!started && vid.networkState === 3) finishWarp();
      }));
      try { if (vid.readyState < 2) vid.load(); } catch (e) {}
      vid.muted = true;
      try { vid.currentTime = 0; } catch (e) {}
      const pp = vid.play();
      if (pp && pp.catch) pp.catch(() => finishWarp());

      function frame() {
        if (!started) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); raf = requestAnimationFrame(frame); return; }
        const t = clamp(vid.currentTime / (vid.duration || 10));
        c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
        drawVideo();
        // 年号：時計が回り始める瞬間（光の切り替え）から遡る
        yearWrap.style.opacity = clamp((t - .37) / .06);
        const e = Math.pow(clamp((t - .38) / .50), 2.2);
        if (era.year === -9999 && t > .86) yearNum.textContent = '∞';
        else {
          const y = t > .88 ? era.year : Math.round(startYear + (era.year - startYear) * e);
          yearNum.innerHTML = y < 0 ? '<small class="bc">B.C.</small>' + Math.abs(y) : y + '<small>年</small>';
        }
        if (t >= .995 || vid.ended) finishWarp(); else raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    }

    /* ============================================================
     *  結果表示
     * ============================================================ */
    function showGate() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const t = $('tarot'); t.classList.remove('flip');
      setScreen('gate-screen');
      t.focus({ preventScroll: true });
    }
    function flipCard() {
      const t = $('tarot');
      if (t.classList.contains('flip')) return;
      t.classList.add('flip');
      vibrate(25);
      setTimeout(() => {
        const flash = $('flash');
        flash.className = 'on';
        setTimeout(() => {
          showResult(lastResult);
          vibrate([30, 40, 60]);
          requestAnimationFrame(() => { flash.className = 'fade'; });
          setTimeout(() => { flash.className = ''; }, 1400);
        }, reduceMotion ? 0 : 250);
      }, reduceMotion ? 0 : 520);
    }

    function showResult(idx) {
      const r = results[idx];
      document.body.classList.add('is-result');
      $('result-screen').style.setProperty('--accent', r.accent);
      const img = $('res-img');
      img.src = r.img;
      img.alt = r.title.replace(/<br>/g, ' ') + 'のイラスト';
      $('res-title').innerHTML = r.title;
      $('res-story').textContent = r.story;
      $('res-talent').textContent = r.talent;
      $('res-weak').textContent = r.weak;
      $('res-message').textContent = r.message;
      $('res-menu').innerHTML = r.menu;

      const rs = $('result-screen');
      rs.classList.remove('revealed');
      setScreen('result-screen');
      void rs.offsetWidth;            // アニメーション再始動
      rs.classList.add('revealed');
      launchSparkles();
    }

    function launchSparkles() {
      if (reduceMotion) return;
      const box = $('sparkles'); box.innerHTML = '';
      for (let i = 0; i < 26; i++) {
        const s = document.createElement('span');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.bottom = (-10 - Math.random() * 10) + 'px';
        s.style.animationDuration = (4 + Math.random() * 5) + 's';
        s.style.animationDelay = (Math.random() * 3) + 's';
        const sz = 4 + Math.random() * 8; s.style.width = s.style.height = sz + 'px';
        box.appendChild(s);
      }
      setTimeout(() => { box.innerHTML = ''; }, 12000);
    }

    function resetQuiz() {
      document.body.classList.remove('is-result');
      $('result-screen').classList.remove('revealed');
      $('sparkles').innerHTML = '';
      buildQuestions();
      setScreen('intro-screen');
    }

    /* ============================================================
     *  星空背景（軽量キャンバス）
     * ============================================================ */
    function initStars() {
      const cv = $('stars'), ctx = cv.getContext('2d');
      let w, h, stars = [];
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
        stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
          x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.3 + .3) * dpr,
          p: Math.random() * Math.PI * 2, s: .5 + Math.random() * 1.5
        }));
      }
      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          const a = .35 + .65 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
          ctx.globalAlpha = a; ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      resize(); addEventListener('resize', () => { resize(); if (reduceMotion) draw(0); });
      requestAnimationFrame(draw);
    }

    /* ============================================================
     *  初期化
     * ============================================================ */
    initBirth();
    initStars();
    preloadResultImages();
    buildQuestions();

    // イントロの前世イラスト・マーキー（2周分を並べて無限ループ）
    (function () {
      const track = $('marquee-track');
      for (let k = 0; k < 2; k++) results.forEach(r => {
        const im = document.createElement('img'); im.src = r.img; im.alt = ''; im.loading = 'lazy'; track.appendChild(im);
      });
    })();

    // 流れ星
    (function () {
      if (reduceMotion) return;
      function spawn() {
        if (!document.hidden) {
          const s = document.createElement('span'); s.className = 'shooting';
          s.style.left = (Math.random() * 70) + '%'; s.style.top = (Math.random() * 35) + '%';
          document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
        }
        setTimeout(spawn, 3500 + Math.random() * 5000);
      }
      setTimeout(spawn, 1500);
    })();

    $('tarot').addEventListener('click', flipCard);
    $('sheet-backdrop').addEventListener('click', () => closeSheet());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    $('start-btn').addEventListener('click', () => { startQuiz(); });
    $('retry-btn').addEventListener('click', resetQuiz);

    // テスト用に公開（本番影響なし）
    window.__zensei = { computeResult, questionPool, results };
  })();
  </script>
</body>
</html>
